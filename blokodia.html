        <div class="panel canvas-panel" ${opts.canvas ? '' : 'hidden'}><div class="panel-h"><span>Холст 16 × 16</span><button class="mini" data-a="save">сохранить картинку</button></div><div class="canvas-host"></div></div>
      </div>`;
    host.appendChild(this.root);
    this.editor = new Editor($('.rn-ed', this.root), opts.code || '', v => { this.stopIfStepping(); opts.onChange && opts.onChange(v); });
    this.editor.onRunShortcut = () => this.run();
    this.canvas = new PixelCanvas($('.canvas-host', this.root), this.grid);
    this.con = $('.con-body', this.root); this.chestBody = $('.chest-body', this.root);
    this.root.addEventListener('click', e => {
      const b = e.target.closest('[data-a],[data-k]'); if (!b) return;
      if (b.dataset.k) { const k = b.dataset.k; this.editor.insert(k === '⇥' ? '    ' : k === '"' ? '""' : k); if (k === '"') { const ta = this.editor.ta; ta.setSelectionRange(ta.selectionStart - 1, ta.selectionStart - 1); } Sfx.click(); return; }
      const a = b.dataset.a;
      if (a === 'run') this.run();
      else if (a === 'step') this.step();
      else if (a === 'stop') this.stop();
      else if (a === 'check') this.check();
      else if (a === 'clearcon') this.con.innerHTML = '';
      else if (a === 'save') App.saveDrawing(this.canvas);
    });
  }
  get code() { return this.editor.value; }
  set code(v) { this.editor.value = v; }
  setBusy(b) {
    $('[data-a="stop"]', this.root).disabled = !b;
    $('[data-a="run"]', this.root).disabled = b && this.mode === 'run';
    const ch = $('[data-a="check"]', this.root); if (ch) ch.disabled = b && this.mode === 'run';
    this.root.classList.toggle('busy', b);
  }
  print(text, kind) {
    const hint = $('.con-hint', this.con); if (hint) hint.remove();
    let last = this.con.lastElementChild;
    if (!last || !last.classList.contains('con-out')) { last = h('div', { class: 'con-out' }); this.con.appendChild(last); }
    const span = h('span', kind === 'input' ? { class: 'con-in' } : null); span.textContent = text;
    last.appendChild(span);
    this.con.scrollTop = this.con.scrollHeight;
  }
  showError(err) {
    const t = MiniPy.ERROR_TITLES[err.pyType] || 'Ошибка';
    const box = h('div', { class: 'con-err' + (err.pyType === 'Stopped' ? ' soft' : '') });
    box.innerHTML = `<div class="err-bot">${robotSVG(34)}</div><div><b>${esc(t)}${err.line ? ` · строка ${err.line}` : ''}</b><p>${esc(err.message)}</p></div>`;
    this.con.appendChild(box); this.con.scrollTop = this.con.scrollHeight;
    if (err.line) this.editor.markLine(err.line, 'err');
  }
  getInput(prompt) {
    return new Promise(res => {
      const wrap = h('div', { class: 'con-input' });
      wrap.innerHTML = `<input type="text" aria-label="Ответ программе" placeholder="Напиши ответ и нажми Enter"><button class="btn btn-sm">Ввод</button>`;
      this.con.appendChild(wrap); this.con.scrollTop = this.con.scrollHeight;
      const inp = $('input', wrap); setTimeout(() => inp.focus({ preventScroll: true }), 30);
      const done = v => { wrap.remove(); this.inputResolver = null; res(v); };
      this.inputResolver = done;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(inp.value); } });
      $('button', wrap).addEventListener('click', () => done(inp.value));
    });
  }
  newSession() {
    this.con.innerHTML = '';
    this.grid = emptyGrid(); this.canvas.setGrid(this.grid);
    const showCanvas = () => { const p = $('.canvas-panel', this.root); if (p.hidden) { p.hidden = false; this.root.classList.add('with-canvas'); } };
    this.prev = new Map();
    this.session = new MiniPy.Session(this.code, {
      out: (s, kind) => { if (kind !== 'input') this.print(s); else { const l = this.con.lastElementChild; if (l && l.classList.contains('con-out')) { const sp = h('span', { class: 'con-in' }); sp.textContent = s; l.appendChild(sp); } else this.print(s, 'input'); } },
      getInput: p => this.getInput(p),
      extraBuiltins: drawBuiltins(this.grid, () => { showCanvas(); this.canvas.request(); }),
    });
    return this.session;
  }
  async run(forCheck) {
    if (this.mode === 'run') return null;
    Sfx.run();
    if (this.session && !this.session.done) this.session.stop();
    this.mode = 'run'; this.setBusy(true);
    const s = this.newSession();
    const r = await s.runToEnd();
    return this.finish(r, forCheck);
  }
  async step() {
    if (this.mode === 'run') return;
    Sfx.step();
    if (!this.session || this.session.done || this.mode !== 'step') {
      this.mode = 'step'; this.setBusy(true); this.newSession();
      if (this.session.done) return this.finish({ done: true, error: this.session.error });
      $('.chest-note', this.root).textContent = 'пошаговый режим';
    }
    const r = await this.session.step();
    if (r.done) { const res = this.finish(r); if (!r.error) App.unlock('debugger'); return res; }
    this.editor.markLine(r.line, 'step');
    this.renderChests(r.scope);
  }
  stop() {
    if (this.session) this.session.stop();
    if (this.inputResolver) this.inputResolver('');
    if (this.mode === 'step' && this.session) { this.finish({ done: true, error: new MiniPy.PyError('Stopped', 'Пошаговый режим остановлен.', null) }); }
  }
  stopIfStepping() { if (this.mode === 'step' && this.session && !this.session.done) { this.session.stop(); this.mode = null; this.setBusy(false); this.editor.markLine(null); $('.chest-note', this.root).textContent = ''; } }
  finish(r, forCheck) {
    const mode = this.mode; this.mode = null; this.setBusy(false);
    this.editor.markLine(null);
    $('.chest-note', this.root).textContent = '';
    const s = this.session;
    if (r.error) { this.showError(r.error); if (r.error.pyType !== 'Stopped') Sfx.err(); }
    else if (!this.con.textContent.trim()) this.con.innerHTML = '<div class="con-hint">Программа выполнилась, но ничего не вывела. Чтобы увидеть результат, используй print().</div>';
    this.renderChests(s.interp.globals);
    const result = makeResult(this.code, s.interp, r.error, this.grid);
    if (!r.error) App.unlock('first_run');
    this.opts.onFinish && this.opts.onFinish(result, forCheck ? 'check' : mode);
    return result;
  }
  renderChests(scope) {
    const scopes = [];
    if (scope && scope !== this.session.interp.globals && scope.name !== 'global') scopes.push(['Внутри станка ' + scope.name, scope.vars]);
    scopes.push([scopes.length ? 'Общие сундуки' : '', this.session.interp.globals.vars]);
    let html = '';
    for (const [title, vars] of scopes) {
      const items = [...vars].filter(([k, v]) => !(v instanceof MiniPy.PyModule) && !(v instanceof MiniPy.PyBuiltin));
      if (title) html += `<div class="chest-title">${esc(title)}</div>`;
      if (!items.length) { html += '<div class="con-hint">Пока пусто.</div>'; continue; }
      html += '<div class="chest-grid">' + items.map(([k, v]) => {
        const key = title + k; const rep = MiniPy.pyRepr(v); const old = this.prev.get(key);
        const changed = old !== undefined && old !== rep; const isNew = old === undefined;
        this.prev.set(key, rep);
        const t = MiniPy.pyTypeShort(v);
        return `<div class="chest ${changed ? 'bump' : ''} ${isNew ? 'new' : ''} t-${t}">
          <div class="chest-lid">${sprite('chest', 22)}<b>${esc(k)}</b><span class="tag">${TYPE_LABEL[t] || t}</span></div>
          <div class="chest-val">${valueHTML(v)}${changed && old.length < 40 ? `<span class="old" aria-hidden="true">${esc(old)}</span>` : ''}</div></div>`;
      }).join('') + '</div>';
    }
    this.chestBody.innerHTML = html;
  }
  async check() {
    const res = await this.run(true);
    if (res && this.opts.onCheck) this.opts.onCheck(res);
  }
}

</script>
<script>
/* ===== widgets.js ===== */
/* ==========================================================================
   ИНТЕРАКТИВЫ ДЛЯ КАЖДОЙ ТЕМЫ
   WIDGETS[id](el, api) строит мини-игру в элементе el.
   api.done() — вызвать, когда ученик разобрался (даёт разовый бонус XP).
   ========================================================================== */
const pyQuote = s => (String(s).includes('"') ? "'" + s + "'" : '"' + s + '"');
const quickRun = code => { const r = MiniPy.runSync(code, { maxSteps: 5000 }); return r.error ? { err: r.error.message } : { out: r.out.replace(/\n$/, '') }; };
const codeBox = (code, cls) => `<pre class="w-code ${cls || ''}">${hl(code)}</pre>`;

const WIDGETS = {
  /* ---------- 1. Робот-говорилка ---------- */
  print(el, api) {
    el.innerHTML = `<div class="w-stage w-talk"><div class="w-bot">${robotSVG(96)}</div><div class="bubble big"><span class="say">…</span></div></div>
      <div class="w-row"><input class="inp" maxlength="40" value="Привет, Блокодия!" aria-label="Что сказать"><button class="btn">Отдать команду</button></div>
      <div class="w-codeline"></div>`;
    const inp = $('input', el), say = $('.say', el), line = $('.w-codeline', el); let n = 0, timer;
    const go = () => {
      const t = inp.value; line.innerHTML = codeBox(`print(${pyQuote(t)})`);
      clearInterval(timer); say.textContent = ''; let i = 0;
      timer = setInterval(() => { say.textContent = t.slice(0, ++i); if (i % 2) Sfx.tone(700 + Math.random() * 300, 0.03, 'square', 0.02); if (i >= t.length) clearInterval(timer); }, 45);
      $('.w-bot', el).classList.remove('hop'); void el.offsetWidth; $('.w-bot', el).classList.add('hop');
      if (++n >= 2) api.done();
    };
    $('button', el).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    go();
  },

  /* ---------- 2. Сундуки-переменные ---------- */
  vars(el, api) {
    el.innerHTML = `<div class="w-row">
        <label>Имя сундука <input class="inp sm" id="vn" value="coal" maxlength="14"></label>
        <span class="eq">=</span>
        <label>Что положить <input class="inp sm" id="vv" value="10" maxlength="16"></label>
        <button class="btn">Положить</button></div>
      <div class="w-msg"></div>
      <div class="w-chests"></div>
      <div class="w-log"></div>`;
    const chests = new Map(); let moves = 0, replaced = false;
    const box = $('.w-chests', el), log = $('.w-log', el), msg = $('.w-msg', el);
    const parse = s => { s = s.trim(); if (/^-?\d+$/.test(s)) return { code: s, show: s }; if (/^-?\d+\.\d+$/.test(s)) return { code: s, show: s }; if (s === 'True' || s === 'False') return { code: s, show: s }; return { code: pyQuote(s), show: pyQuote(s) }; };
    const put = () => {
      const name = $('#vn', el).value.trim(); const val = parse($('#vv', el).value);
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { msg.innerHTML = `<span class="bad">Имя «${esc(name)}» не подойдёт. Только английские буквы, цифры и _, без пробелов, и не с цифры.</span>`; Sfx.err(); return; }
      msg.textContent = '';
      let c = chests.get(name);
      if (!c) {
        c = h('div', { class: 'w-chest' }, `${sprite('chest', 56)}<div class="w-lbl">${esc(name)}</div><div class="w-slot"></div>`);
        box.appendChild(c); chests.set(name, c);
      }
      const slot = $('.w-slot', c);
      const old = slot.firstElementChild;
      if (old) { replaced = true; old.classList.add('out'); setTimeout(() => old.remove(), 650); log.insertAdjacentHTML('beforeend', `<div class="note">Старое значение ${esc(old.textContent)} выкинуто!</div>`); Sfx.pop(); }
      const tok = h('span', { class: 'w-tok in' }); tok.textContent = val.show; slot.appendChild(tok);
      Sfx.coin();
      log.insertAdjacentHTML('beforeend', codeBox(`${name} = ${val.code}`));
      log.scrollTop = log.scrollHeight;
      if (++moves >= 3 && replaced) api.done();
    };
    $('button', el).onclick = put;
    $$('input', el).forEach(i => i.onkeydown = e => { if (e.key === 'Enter') put(); });
    msg.innerHTML = '<span class="note">Положи что-нибудь в сундук, а потом положи в <b>тот же</b> сундук другое значение.</span>';
  },

  /* ---------- 3. Сортировка ресурсов по типам ---------- */
  types(el, api) {
    const cards = [['64', 'int'], ['3.5', 'float'], ['"камень"', 'str'], ['True', 'bool'], ['0', 'int'], ['"64"', 'str'], ['-7', 'int'], ['0.25', 'float'], ['False', 'bool'], ['"True"', 'str'], ['100.0', 'float'], ['"🙂"', 'str']];
    const why = {
      '"64"': 'В кавычках — значит текст, даже если внутри цифры!', '"True"': 'Кавычки превращают True в обычный текст.',
      '0': '0 — целое число. Рычаг bool — это только True и False.', '100.0': 'Есть точка — значит float, даже если после неё ноль.',
      '3.5': 'Есть точка — значит дробное (float).', '0.25': 'Есть точка — значит дробное (float).',
    };
    const bins = [['int', 'Блоки', 'block'], ['float', 'Жидкости', 'diamond'], ['str', 'Таблички', 'sign'], ['bool', 'Рычаги', 'lever']];
    el.innerHTML = `<p class="w-tip">Нажми на значение, потом на сундук, куда его положить.</p>
      <div class="w-cards">${cards.map(([v, t], i) => `<button class="card" data-i="${i}">${esc(v)}</button>`).join('')}</div>
      <div class="w-bins">${bins.map(([t, n, sp]) => `<button class="bin" data-t="${t}">${sprite(sp, 32)}<b>${n}</b><code>${t}</code><div class="bin-in"></div></button>`).join('')}</div>
      <div class="w-msg"></div>`;
    let sel = null, left = cards.length, mistakes = 0;
    const msg = $('.w-msg', el);
    $$('.card', el).forEach(c => c.onclick = () => { $$('.card', el).forEach(x => x.classList.remove('sel')); sel = c; c.classList.add('sel'); Sfx.click(); });
    $$('.bin', el).forEach(b => b.onclick = () => {
      if (!sel) { msg.innerHTML = '<span class="note">Сначала выбери значение сверху.</span>'; return; }
      const [v, t] = cards[sel.dataset.i];
      if (t === b.dataset.t) {
        $('.bin-in', b).insertAdjacentHTML('beforeend', `<span>${esc(v)}</span>`); sel.remove(); sel = null; left--; Sfx.coin();
        msg.innerHTML = left ? `<span class="good">Верно! ${v} — это ${t}.</span>` : '<span class="good">Всё рассортировано! Ты отличаешь типы данных.</span>';
        if (!left) { api.done(); FX.burst(innerWidth / 2, innerHeight / 2, 40); }
      } else {
        mistakes++; Sfx.err(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        msg.innerHTML = `<span class="bad">${esc(v)} сюда не подходит. ${why[v] || 'Подумай: есть ли кавычки? Есть ли точка?'}</span>`;
      }
    });
  },

  /* ---------- 4. Калькулятор стаков ---------- */
  arith(el, api) {
    el.innerHTML = `<div class="w-row"><label>Блоков в инвентаре: <b class="big-n" id="bn">150</b></label>
      <input type="range" min="0" max="400" value="150" id="br" aria-label="Количество блоков">
      <label>Стак по <select id="st" class="inp sm"><option>64</option><option>16</option></select></label></div>
      <div class="w-stacks"></div><div class="w-code-out"></div>`;
    let moved = 0;
    const upd = () => {
      const n = +$('#br', el).value, st = +$('#st', el).value;
      $('#bn', el).textContent = n;
      const full = Math.floor(n / st), rest = n % st;
      let html = '';
      for (let i = 0; i < Math.min(full, 25); i++) html += `<span class="stk">${sprite('block', 34)}<i>${st}</i></span>`;
      if (full > 25) html += `<span class="stk more">+${full - 25}</span>`;
      if (rest) html += `<span class="stk part">${sprite('block', 34)}<i>${rest}</i></span>`;
      $('.w-stacks', el).innerHTML = html || '<span class="note">Пусто</span>';
      $('.w-code-out', el).innerHTML = codeBox(`blocks = ${n}\nprint(blocks // ${st})   # ${full} — полных стаков\nprint(blocks % ${st})    # ${rest} — остаток`);
    };
    $('#br', el).oninput = () => { upd(); if (++moved === 15) api.done(); };
    $('#st', el).onchange = upd; upd();
  },

  /* ---------- 5. Разговор через input() ---------- */
  input(el, api) {
    el.innerHTML = `<div class="w-chat"></div><div class="w-row w-ask"><input class="inp" aria-label="Твой ответ" placeholder="Твой ответ"><button class="btn">Enter</button></div>`;
    const chat = $('.w-chat', el), inp = $('input', el);
    let stage = 0, name = '';
    const say = (who, html) => { chat.insertAdjacentHTML('beforeend', `<div class="msg ${who}">${who === 'bot' ? robotSVG(28) : ''}<div>${html}</div></div>`); chat.scrollTop = chat.scrollHeight; };
    const code = c => say('code', codeBox(c));
    const ask = () => {
      if (stage === 0) { code('name = input("Как тебя зовут? ")'); say('bot', 'Как тебя зовут?'); }
      if (stage === 1) { code('age = int(input("Сколько тебе лет? "))'); say('bot', 'Сколько тебе лет?'); }
      inp.focus({ preventScroll: true });
    };
    const answer = () => {
      const v = inp.value.trim(); if (!v) return; inp.value = '';
      say('me', esc(v)); Sfx.click();
      if (stage === 0) {
        name = v; code('print("Привет,", name)'); say('bot', `Привет, ${esc(name)}`); stage = 1; setTimeout(ask, 400);
      } else if (stage === 1) {
        if (!/^\d+$/.test(v)) { say('err', `<b>Ошибка:</b> Не могу превратить «${esc(v)}» в целое число. int() понимает только цифры. Попробуй ещё раз!`); Sfx.err(); setTimeout(ask, 400); return; }
        code('print("Через год тебе будет", age + 1)'); say('bot', `Через год тебе будет ${+v + 1}`);
        say('note', 'Заметил? Без int() Python не смог бы прибавить 1 — ведь input() отдаёт текст.');
        stage = 2; api.done(); $('.w-ask', el).hidden = true;
      }
    };
    $('button', el).onclick = answer; inp.onkeydown = e => { if (e.key === 'Enter') answer(); };
    ask();
  },

  /* ---------- 6. Мастерская табличек ---------- */
  strings(el, api) {
    const ops = ['a + b', 'a + " " + b', 'a * 3', 'len(a)', 'f"{a} {b}!"', 'a.upper()', '"=" * 12'];
    el.innerHTML = `<div class="w-row"><label>a = <input class="inp sm" id="sa" value="База" maxlength="16"></label><label>b = <input class="inp sm" id="sb" value="Тёмы" maxlength="16"></label></div>
      <div class="w-ops">${ops.map(o => `<button class="chip" data-o="${esc(o)}">${hl(o)}</button>`).join('')}</div>
      <div class="w-signwrap"><div class="w-sign"><span>Выбери команду</span></div><div class="w-post"></div></div><div class="w-code-out"></div>`;
    const used = new Set();
    $$('.chip', el).forEach(b => b.onclick = () => {
      const a = $('#sa', el).value, bb = $('#sb', el).value, o = b.dataset.o;
      const code = `a = ${pyQuote(a)}\nb = ${pyQuote(bb)}\nprint(${o})`;
      const r = quickRun(code);
      $('.w-sign span', el).textContent = r.err ? 'Ошибка!' : r.out;
      $('.w-code-out', el).innerHTML = codeBox(code + `   # ${r.err || r.out}`);
      $('.w-sign', el).classList.remove('swing'); void el.offsetWidth; $('.w-sign', el).classList.add('swing');
      Sfx.click(); used.add(o); if (used.size >= 4) api.done();
    });
  },

  /* ---------- 7. Вагонетка на развилке ---------- */
  ifelse(el, api) {
    el.innerHTML = `<div class="w-row"><label>health = <b class="big-n" id="hv">25</b></label><input type="range" min="0" max="100" value="25" id="hr" aria-label="Здоровье"><button class="btn">Поехали!</button></div>
      <div class="w-fork-wrap"><svg class="w-fork" viewBox="0 0 600 220" role="img" aria-label="Развилка с тремя путями">
        <path id="pA" d="M20 110 H200" class="rail"/>
        <path id="p0" d="M200 110 C260 110 270 40 340 40 H512" class="rail"/>
        <path id="p1" d="M200 110 H512" class="rail"/>
        <path id="p2" d="M200 110 C260 110 270 180 340 180 H512" class="rail"/>
        <g class="dest" id="d0"><rect x="512" y="22" width="84" height="36"/><text x="554" y="45">назад</text></g>
        <g class="dest" id="d1"><rect x="512" y="92" width="84" height="36"/><text x="554" y="115">осторожно</text></g>
        <g class="dest" id="d2"><rect x="512" y="162" width="84" height="36"/><text x="554" y="185">точка</text></g>
        <g id="cart"><rect x="-16" y="-14" width="32" height="18" fill="#8a5a35" stroke="#1d1b26" stroke-width="3"/><rect x="-12" y="-20" width="24" height="7" fill="#5bb441"/><rect x="-13" y="4" width="8" height="8" fill="#1d1b26"/><rect x="5" y="4" width="8" height="8" fill="#1d1b26"/></g>
      </svg></div>
      <div class="w-lines"></div><div class="w-msg"></div>`;
    const lines = hp => [`health = ${hp}`, 'if health < 30:', '    print("Отступаю!")', 'elif health < 70:', '    print("Иду осторожно")', 'else:', '    print("На точку!")'];
    const renderCode = (hp, active, marks) => {
      $('.w-lines', el).innerHTML = '<pre class="w-code">' + lines(hp).map((l, i) => `<span class="ln ${active === i ? 'on' : ''}">${hlLine(l) || ' '}${marks && marks[i] !== undefined ? `<em class="${marks[i] ? 't' : 'f'}">  → ${marks[i] ? 'True' : 'False'}</em>` : ''}</span>`).join('') + '</pre>';
    };
    const cart = $('#cart', el); let busy = false, rides = 0;
    const place = (p, t) => { const L = p.getTotalLength(); const pt = p.getPointAtLength(L * t); cart.setAttribute('transform', `translate(${pt.x} ${pt.y})`); };
    const anim = (p, ms) => new Promise(res => {
      if (reduceMotion()) { place(p, 1); return res(); }
      const t0 = performance.now(); const f = now => { const t = Math.min(1, (now - t0) / ms); place(p, t); if (t < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f);
    });
    const wait = ms => new Promise(r => setTimeout(r, reduceMotion() ? 0 : ms));
    place($('#pA', el), 0);
    $('#hr', el).oninput = () => { $('#hv', el).textContent = $('#hr', el).value; if (!busy) renderCode($('#hr', el).value); };
    renderCode(25);
    $('button', el).onclick = async () => {
      if (busy) return; busy = true; $$('.dest', el).forEach(d => d.classList.remove('hit'));
      const hp = +$('#hr', el).value; const marks = {};
      $('.w-msg', el).textContent = '';
      await anim($('#pA', el), 700);
      let branch;
      renderCode(hp, 1); await wait(350);
      marks[1] = hp < 30; renderCode(hp, 1, marks); await wait(450);
      if (marks[1]) branch = 0; else {
        renderCode(hp, 3, marks); await wait(350); marks[3] = hp < 70; renderCode(hp, 3, marks); await wait(450);
        if (marks[3]) branch = 1; else { renderCode(hp, 5, marks); await wait(400); branch = 2; }
      }
      renderCode(hp, [2, 4, 6][branch], marks);
      Sfx.step();
      await anim($(`#p${branch}`, el), 900);
      $(`#d${branch}`, el).classList.add('hit'); Sfx.coin();
      $('.w-msg', el).innerHTML = `<span class="good">Вывод: ${['Отступаю!', 'Иду осторожно', 'На точку!'][branch]}</span>`;
      await wait(900); place($('#pA', el), 0); busy = false;
      if (++rides >= 3) api.done();
    };
  },

  /* ---------- 8. Дверь с рычагами ---------- */
  logic(el, api) {
    const exprs = ['has_key and pin == 1234', 'has_key or is_admin', 'not has_key', '(has_key and pin == 1234) or is_admin'];
    el.innerHTML = `<div class="w-logic">
      <div class="levers">
        <button class="lever-btn on" data-v="has_key">${sprite('key', 28)}<b>has_key</b><span>True</span></button>
        <button class="lever-btn" data-v="is_admin">${sprite('star', 28)}<b>is_admin</b><span>False</span></button>
        <label class="pin">${sprite('lock', 28)}<b>pin</b><input class="inp sm" type="number" value="1234" aria-label="pin"></label>
      </div>
      <div class="door-wrap"><div class="door"><div class="dl"></div><div class="dr"></div><div class="lamp"></div></div></div></div>
      <div class="w-ops">${exprs.map((x, i) => `<button class="chip ${i === 0 ? 'sel' : ''}" data-x="${esc(x)}">${hl(x)}</button>`).join('')}</div>
      <div class="w-code-out"></div>`;
    const st = { has_key: true, is_admin: false }; let expr = exprs[0]; const seen = new Set();
    const upd = () => {
      const pin = parseInt($('input', el).value || '0', 10) || 0;
      const code = `has_key = ${st.has_key ? 'True' : 'False'}\nis_admin = ${st.is_admin ? 'True' : 'False'}\npin = ${pin}\nprint(${expr})`;
      const r = quickRun(code); const open = r.out === 'True';
      $('.door', el).classList.toggle('open', open);
      $('.w-code-out', el).innerHTML = codeBox(code + `   # ${r.out}`);
      seen.add(expr + open); if (seen.size >= 5) api.done();
    };
    $$('.lever-btn', el).forEach(b => b.onclick = () => { const k = b.dataset.v; st[k] = !st[k]; b.classList.toggle('on', st[k]); $('span', b).textContent = st[k] ? 'True' : 'False'; Sfx.click(); upd(); });
    $('input', el).oninput = upd;
    $$('.chip', el).forEach(c => c.onclick = () => { $$('.chip', el).forEach(x => x.classList.remove('sel')); c.classList.add('sel'); expr = c.dataset.x; Sfx.click(); upd(); });
    upd();
  },

  /* ---------- 9. Конвейер for/range ---------- */
  for(el, api) {
    el.innerHTML = `<div class="w-row">range(<input class="inp xs" id="ra" type="number" value="1" min="-5" max="20">, <input class="inp xs" id="rb" type="number" value="6" min="-5" max="25">, <input class="inp xs" id="rc" type="number" value="1" min="-5" max="5">)
      <button class="btn">Запустить конвейер</button></div>
      <div class="w-belt"><div class="belt-track"></div><div class="belt-counter">i = <b>—</b></div></div>
      <div class="w-code-out"></div><div class="w-out"></div>`;
    let busy = false, runs = 0;
    const code = () => `for i in range(${$('#ra', el).value}, ${$('#rb', el).value}, ${$('#rc', el).value}):\n    print("Деталь", i)`;
    const show = () => { $('.w-code-out', el).innerHTML = codeBox(code()); };
    $$('input', el).forEach(i => i.oninput = show); show();
    $('button', el).onclick = async () => {
      if (busy) return;
      const a = +$('#ra', el).value, b = +$('#rb', el).value, c = +$('#rc', el).value;
      if (c === 0) { $('.w-out', el).innerHTML = '<span class="bad">Шаг 0 — конвейер стоит на месте! Python скажет ошибку.</span>'; Sfx.err(); return; }
      const vals = []; if (c > 0) for (let i = a; i < b && vals.length < 12; i += c) vals.push(i); else for (let i = a; i > b && vals.length < 12; i += c) vals.push(i);
      busy = true; const track = $('.belt-track', el), out = $('.w-out', el);
      track.innerHTML = ''; out.innerHTML = ''; el.querySelector('.w-belt').classList.add('moving');
      if (!vals.length) out.innerHTML = '<span class="note">range пустой — конвейер не повезёт ни одной детали. Проверь: начало должно быть меньше конца.</span>';
      for (const v of vals) {
        const it = h('div', { class: 'belt-item' }, `${sprite('gear', 30)}<b>${v}</b>`); track.appendChild(it);
        $('.belt-counter b', el).textContent = v; Sfx.step();
        requestAnimationFrame(() => it.classList.add('go'));
        out.insertAdjacentHTML('beforeend', `<div>Деталь ${v}</div>`);
        await new Promise(r => setTimeout(r, reduceMotion() ? 60 : 520));
      }
      el.querySelector('.w-belt').classList.remove('moving');
      if (vals.length) out.insertAdjacentHTML('beforeend', `<div class="note">Цикл повторился ${vals.length} раз.</div>`);
      busy = false; if (++runs >= 2) api.done();
    };
  },

  /* ---------- 10. Бур while ---------- */
  while(el, api) {
    el.innerHTML = `<div class="w-row"><label>ore = <b class="big-n" id="ov">20</b></label><input type="range" min="5" max="40" value="20" id="or" aria-label="Руда">
      <label class="chk"><input type="checkbox" id="fg"> забыть уменьшать ore</label></div>
      <div class="w-drill"><div class="drill-bot">${sprite('drill', 54)}</div><div class="ore-bar"><i></i></div><div class="drill-n">Повторов: <b>0</b></div></div>
      <div class="w-row"><button class="btn" id="dg">Запустить бур</button><button class="btn btn-ghost" id="ds" disabled>Стоп</button></div>
      <div class="w-code-out"></div><div class="w-msg"></div>`;
    let timer = null, success = false, sawInfinite = false;
    const code = () => `ore = ${$('#or', el).value}\nwhile ore > 0:\n${$('#fg', el).checked ? '    # ore = ore - 5   ← забыли!' : '    ore = ore - 5'}\n    print("Копаю!")`;
    const show = () => { $('#ov', el).textContent = $('#or', el).value; $('.w-code-out', el).innerHTML = codeBox(code()); };
    $('#or', el).oninput = show; $('#fg', el).onchange = show; show();
    const stop = (msg) => { clearInterval(timer); timer = null; $('#dg', el).disabled = false; $('#ds', el).disabled = true; $('.w-drill', el).classList.remove('on'); if (msg) $('.w-msg', el).innerHTML = msg; if (success && sawInfinite) api.done(); };
    $('#ds', el).onclick = () => { stop('<span class="good">Остановлено кнопкой «Стоп». Так и спасают зависшие программы!</span>'); };
    $('#dg', el).onclick = () => {
      let ore = +$('#or', el).value; const total = ore; const forgot = $('#fg', el).checked; let n = 0;
      $('#dg', el).disabled = true; $('#ds', el).disabled = false; $('.w-msg', el).textContent = ''; $('.w-drill', el).classList.add('on');
      timer = setInterval(() => {
        if (!(ore > 0)) { success = true; return stop(`<span class="good">ore = ${ore}. Условие ore > 0 стало False — цикл закончился сам после ${n} повторов.</span>`); }
        if (!forgot) ore -= 5; n++;
        Sfx.dig();
        $('.ore-bar i', el).style.width = Math.max(0, ore / total * 100) + '%';
        $('.drill-n b', el).textContent = n;
        if (forgot && n === 10) { sawInfinite = true; $('.w-msg', el).innerHTML = '<span class="bad">Руда не уменьшается — условие всегда True. Бур копает вечно! Жми «Стоп».</span>'; }
        if (n > 300) stop('<span class="bad">Автостоп после 300 повторов.</span>');
      }, reduceMotion() ? 60 : 260);
    };
  },

  /* ---------- 11. Инвентарь-список ---------- */
  lists(el, api) {
    const items = ['меч', 'щит', 'хлеб', 'яблоко', 'алмаз', 'факел', 'кирка', 'уголь'];
    el.innerHTML = `<div class="w-inv"></div>
      <div class="w-row"><select class="inp sm" id="it">${items.map(i => `<option>${i}</option>`).join('')}</select>
        <button class="chip" data-o="append">.append(…)</button><button class="chip" data-o="remove">.remove(…)</button><button class="chip" data-o="pop">.pop()</button>
        <button class="chip" data-o="len">len()</button><button class="chip" data-o="in">… in inventory</button><button class="chip" data-o="first">inventory[0]</button></div>
      <div class="w-code-out"></div>`;
    let inv = ['кирка', 'факел']; const used = new Set();
    const draw = (flash) => {
      let html = '';
      for (let i = 0; i < 9; i++) { const x = inv[i]; html += `<div class="inv-slot ${i === flash ? 'flash' : ''}"><em>${i}</em>${x ? (itemSprite(x, 34) || '') + `<small>${esc(x)}</small>` : ''}</div>`; }
      $('.w-inv', el).innerHTML = html;
    };
    const say = (c, res) => { $('.w-code-out', el).innerHTML = codeBox(`inventory = ${MiniPy.pyRepr(new MiniPy.PyList(inv))}\n${c}${res !== undefined ? '   # ' + res : ''}`); };
    $$('.chip', el).forEach(b => b.onclick = () => {
      const it = $('#it', el).value, o = b.dataset.o; used.add(o); Sfx.click();
      if (o === 'append') { if (inv.length >= 9) { say(`inventory.append("${it}")`, 'инвентарь полон!'); return; } inv.push(it); draw(inv.length - 1); say(`inventory.append("${it}")`); }
      if (o === 'remove') { const i = inv.indexOf(it); if (i < 0) { say(`inventory.remove("${it}")`, `ошибка: «${it}» нет в списке`); Sfx.err(); return; } inv.splice(i, 1); draw(); say(`inventory.remove("${it}")`); }
      if (o === 'pop') { if (!inv.length) { say('inventory.pop()', 'ошибка: список пуст'); Sfx.err(); return; } const x = inv.pop(); draw(); say('item = inventory.pop()', `достали «${x}»`); }
      if (o === 'len') say('print(len(inventory))', inv.length);
      if (o === 'in') say(`print("${it}" in inventory)`, inv.includes(it) ? 'True' : 'False');
      if (o === 'first') say('print(inventory[0])', inv.length ? inv[0] : 'ошибка: список пуст');
      if (used.size >= 4) api.done();
    });
    draw(); say('');
  },

  /* ---------- 12. Книга рецептов ---------- */
  dicts(el, api) {
    const rec = { 'факел': 'уголь + палка', 'кирка': '3 камня + 2 палки', 'меч': '2 железа + палка', 'хлеб': '3 пшеницы' };
    el.innerHTML = `<div class="w-book"><div class="page keys"></div><div class="page val"><span class="note">Нажми на ключ слева</span></div></div>
      <div class="w-row"><input class="inp sm" id="dk" placeholder="ключ" maxlength="14"><span class="eq">→</span><input class="inp" id="dv" placeholder="значение" maxlength="30"><button class="btn">Добавить рецепт</button></div>
      <div class="w-code-out"></div>`;
    let opened = 0;
    const keys = () => {
      $('.keys', el).innerHTML = Object.keys(rec).map(k => `<button class="rk">${itemSprite(k, 22) || sprite('sign', 22)}<span>${esc(k)}</span></button>`).join('');
      $$('.rk', el).forEach(b => b.onclick = () => {
        const k = $('span', b).textContent; $$('.rk', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel');
        $('.val', el).innerHTML = `<h4>${esc(k)}</h4><p>${esc(rec[k])}</p>`;
        $('.w-code-out', el).innerHTML = codeBox(`print(recipes[${pyQuote(k)}])   # ${rec[k]}`); Sfx.click();
        if (++opened >= 3) api.done();
      });
    };
    $('button.btn', el).onclick = () => {
      const k = $('#dk', el).value.trim(), v = $('#dv', el).value.trim();
      if (!k || !v) { $('.w-code-out', el).innerHTML = '<span class="bad">Заполни и ключ, и значение.</span>'; return; }
      const had = k in rec; rec[k] = v; keys();
      $('.w-code-out', el).innerHTML = codeBox(`recipes[${pyQuote(k)}] = ${pyQuote(v)}${had ? '   # ключ уже был — значение заменилось' : ''}`); Sfx.coin();
      $('#dk', el).value = ''; $('#dv', el).value = '';
    };
    keys();
    $('.w-code-out', el).innerHTML = codeBox('recipes = {\n' + Object.entries(rec).map(([k, v]) => `    ${pyQuote(k)}: ${pyQuote(v)},`).join('\n') + '\n}');
  },

  /* ---------- 13. Станок-функция ---------- */
  funcs(el, api) {
    const machines = [
      { name: 'smelt', def: 'def smelt(ore):\n    return ore * 2', args: [['ore', '5']], label: 'Плавильня' },
      { name: 'stamp', def: 'def stamp(name):\n    return "★ " + name + " ★"', args: [['name', 'Болтик']], label: 'Гравировщик', str: true },
      { name: 'area', def: 'def area(w, h):\n    return w * h', args: [['w', '4'], ['h', '3']], label: 'Мерило' },
    ];
    el.innerHTML = `<div class="w-tabs">${machines.map((m, i) => `<button class="chip ${i ? '' : 'sel'}" data-i="${i}">${m.label}</button>`).join('')}</div>
      <div class="w-machine"><div class="m-in"></div><div class="m-body"><span class="g1">${sprite('gear', 40)}</span><span class="g2">${sprite('gear', 30)}</span><b class="m-name"></b></div><div class="m-out"><span class="note">выход</span></div></div>
      <div class="w-row m-args"></div><div class="w-code-out"></div>`;
    let cur = 0, uses = 0;
    const setup = () => {
      const m = machines[cur];
      $('.m-name', el).textContent = m.name + '()';
      $('.m-args', el).innerHTML = m.args.map(([a, d]) => `<label>${a} = <input class="inp sm" data-a="${a}" value="${esc(d)}"></label>`).join('') + '<button class="btn">Запустить станок</button>';
      $('.m-out', el).innerHTML = '<span class="note">выход</span>'; $('.m-in', el).innerHTML = '';
      $('.w-code-out', el).innerHTML = codeBox(m.def);
      $('.m-args .btn', el).onclick = go;
    };
    const go = () => {
      const m = machines[cur];
      const vals = $$('.m-args input', el).map(i => (m.str ? pyQuote(i.value) : (i.value.trim() || '0')));
      const call = `${m.name}(${vals.join(', ')})`;
      const r = quickRun(`${m.def}\nprint(${call})`);
      $('.m-in', el).innerHTML = `<span class="w-tok in">${esc(vals.join(', '))}</span>`;
      el.querySelector('.w-machine').classList.add('work'); Sfx.dig();
      setTimeout(() => {
        el.querySelector('.w-machine').classList.remove('work');
        $('.m-out', el).innerHTML = `<span class="w-tok in ${r.err ? 'bad' : ''}">${esc(r.err ? 'ошибка' : r.out)}</span>`;
        Sfx.coin();
      }, reduceMotion() ? 50 : 800);
      $('.w-code-out', el).innerHTML = codeBox(`${m.def}\n\nresult = ${call}\nprint(result)   # ${r.err || r.out}`);
      if (++uses >= 3) api.done();
    };
    $$('.w-tabs .chip', el).forEach(b => b.onclick = () => { $$('.w-tabs .chip', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); cur = +b.dataset.i; setup(); Sfx.click(); });
    setup();
  },

  /* ---------- 14. Генератор лута ---------- */
  random(el, api) {
    const loot = ['камень', 'камень', 'камень', 'уголь', 'уголь', 'железо', 'алмаз'];
    el.innerHTML = `<div class="w-loot-list">${codeBox('loot = ' + MiniPy.pyRepr(new MiniPy.PyList(loot)))}</div>
      <div class="w-row"><button class="btn" id="d1">Копать!  random.choice(loot)</button><button class="btn btn-ghost" id="d10">Копать ×10</button><button class="btn btn-ghost" id="dice">Кубик randint(1, 6)</button></div>
      <div class="w-drop"><div class="drop-spot"></div><div class="dice"></div></div>
      <div class="w-tally"></div>`;
    const tally = {}; let digs = 0;
    const drawT = () => {
      const max = Math.max(1, ...Object.values(tally));
      $('.w-tally', el).innerHTML = [...new Set(loot)].map(k => `<div class="tl">${itemSprite(k, 22)}<span>${k}</span><i style="width:${(tally[k] || 0) / max * 100}%"></i><b>${tally[k] || 0}</b></div>`).join('');
    };
    const dig = (silent) => {
      const x = loot[Math.floor(Math.random() * loot.length)]; tally[x] = (tally[x] || 0) + 1; digs++;
      if (!silent) {
        const spot = $('.drop-spot', el); spot.innerHTML = `<div class="dropped">${itemSprite(x, 54)}<b>${x}</b></div>`;
        if (x === 'алмаз') { const r = spot.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + 20, 24, ['#5fd6e8', '#ffffff', '#2b9fb3']); Sfx.ach(); } else Sfx.dig();
      }
      return x;
    };
    $('#d1', el).onclick = () => { dig(); drawT(); if (digs >= 10) api.done(); };
    $('#d10', el).onclick = () => { for (let i = 0; i < 9; i++) dig(true); dig(); drawT(); if (digs >= 10) api.done(); };
    $('#dice', el).onclick = () => { const v = 1 + Math.floor(Math.random() * 6); $('.dice', el).innerHTML = `<span class="die">${v}</span>`; Sfx.click(); };
    drawT();
  },

  /* ---------- 15. Рисуем мышкой — видим код ---------- */
  draw(el, api) {
    const pal = ['red', 'orange', 'yellow', 'green', 'cyan', 'blue', 'purple', 'brown', 'black', 'white'];
    el.innerHTML = `<div class="w-paint"><div><div class="paint-pal">${pal.map((c, i) => `<button class="sw ${i ? '' : 'sel'}" data-c="${c}" style="background:${COLOR_NAMES[c]}" aria-label="${c}"></button>`).join('')}<button class="chip" id="pclr">очистить</button></div>
      <div class="paint-grid" role="grid" aria-label="Холст 16 на 16">${Array.from({ length: 256 }, (_, i) => `<span data-i="${i}"></span>`).join('')}</div><div class="paint-xy">Наведи на клетку</div></div>
      <div class="paint-code"><b>Код твоего рисунка:</b><pre class="w-code"></pre></div></div>`;
    let color = 'red', down = false; const lines = []; let count = 0;
    const g = $('.paint-grid', el);
    const paint = t => {
      if (!t || !t.dataset.i) return; const i = +t.dataset.i, x = i % 16, y = Math.floor(i / 16);
      if (t.dataset.c === color) return;
      t.style.background = COLOR_NAMES[color]; t.dataset.c = color;
      lines.push(`draw(${x}, ${y}, "${color}")`); if (lines.length > 14) lines.shift();
      $('.paint-code pre', el).innerHTML = hl(lines.join('\n'));
      if (++count === 12) api.done();
    };
    g.addEventListener('pointerdown', e => { down = true; g.setPointerCapture && g.releasePointerCapture && 0; paint(e.target); });
    g.addEventListener('pointerover', e => { const t = e.target; if (t.dataset.i) { const i = +t.dataset.i; $('.paint-xy', el).textContent = `x = ${i % 16}, y = ${Math.floor(i / 16)}`; } if (down) paint(t); });
    g.addEventListener('pointermove', e => { if (!down || e.pointerType === 'mouse') return; paint(document.elementFromPoint(e.clientX, e.clientY)); });
    addEventListener('pointerup', () => { down = false; });
    $$('.sw', el).forEach(b => b.onclick = () => { $$('.sw', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); color = b.dataset.c; Sfx.click(); });
    $('#pclr', el).onclick = () => { $$('span', g).forEach(s => { s.style.background = ''; delete s.dataset.c; }); lines.length = 0; $('.paint-code pre', el).innerHTML = hl('clear()'); };
  },
};

</script>
<script>
/* ===== app.js ===== */
/* ==========================================================================
   ИГРА: состояние, экраны, награды
   ========================================================================== */
const SAVE_KEY = 'blokodia_save_v1';
const DEFAULT_STATE = () => ({
  name: '', xp: 0, blocks: 0, ore: 0, gems: 0,
  done: {}, tasks: {}, quiz: {}, bosses: {}, ach: {}, widgets: {}, stage: {}, codes: {},
  skin: 'novice', crafted: [], sound: true, quizCorrect: 0, noHintTasks: 0, sandbox: '', theme: '',
});
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const LOC_OF = {}; LOCATIONS.forEach(l => { l.topics.forEach(t => (LOC_OF[t] = l)); LOC_OF[l.boss] = l; });
// Порядок прохождения: темы локации, потом её босс
const ORDER = LOCATIONS.flatMap(l => [...l.topics.map(id => ({ kind: 'topic', id })), { kind: 'boss', id: l.boss }]);
const TOPIC_NUM = Object.fromEntries(TOPICS.map((t, i) => [t.id, i + 1]));

const App = {
  s: null,
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { }
    this.s = Object.assign(DEFAULT_STATE(), s || {});
    Sfx.on = this.s.sound;
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.s)); } catch (e) { } },

  /* ---------- Прогресс ---------- */
  isDone(item) { return item.kind === 'topic' ? !!this.s.done[item.id] : !!this.s.bosses[LOC_OF[item.id].id]; },
  isOpen(item) { const i = ORDER.findIndex(o => o.id === item.id); return i === 0 || this.isDone(ORDER[i - 1]); },
  nextItem() { return ORDER.find(o => !this.isDone(o)) || null; },
  level(xp) { xp = xp === undefined ? this.s.xp : xp; let l = 1; while (xp >= 50 * l * (l + 1)) l++; return l; },
  levelSpan(l) { return [l === 1 ? 0 : 50 * (l - 1) * l, 50 * l * (l + 1)]; },
  skinsOwned() {
    const s = this.s, own = ['novice'];
    const map = { mine: 'miner', forge: 'smith', arena: 'tactic', factory: 'engineer', studio: 'artist' };
    for (const k in map) if (s.bosses[k]) own.push(map[k]);
    if (s.ach.no_hints5) own.push('crystal');
    if (s.ach.finish) own.push('gold');
    return own;
  },

  /* ---------- Награды ---------- */
  award(r, fromEl) {
    const before = this.level();
    this.s.xp += r.xp || 0; this.s.blocks += r.blocks || 0; this.s.ore += r.ore || 0; this.s.gems += r.gems || 0;
    this.save();
    if (fromEl) { if (r.blocks) FX.drop(fromEl, 'blocks', r.blocks); if (r.ore) FX.drop(fromEl, 'ore', r.ore); if (r.gems) FX.drop(fromEl, 'gems', r.gems * 3); if (r.xp) FX.drop(fromEl, 'xp', 3); }
    setTimeout(() => this.renderTop(), fromEl ? 900 : 0);
    const after = this.level();
    if (after > before) setTimeout(() => {
      Sfx.level(); FX.fireworks();
      toast(`Новый уровень: ${after}!`, 'star', 'Твой герой становится сильнее.');
      this.checkDerived();
    }, 1100);
  },
  unlock(id) {
    if (!this.s || this.s.ach[id]) return;
    const a = ACHIEVEMENTS.find(x => x.id === id); if (!a) return;
    this.s.ach[id] = true; this.save();
    setTimeout(() => { Sfx.ach(); toast('Достижение: ' + a.name, a.icon, a.desc + ' · +15 XP'); this.award({ xp: 15 }); }, 300);
    if (id === 'no_hints5' || id === 'finish') setTimeout(() => toast('Новый скин открыт!', 'star', 'Загляни в профиль героя.'), 2200);
  },
  checkDerived() {
    const s = this.s;
    if (s.done.for && s.done.while) this.unlock('loops');
    if (s.quizCorrect >= 10) this.unlock('quiz10');
    if (Object.keys(s.bosses).length) this.unlock('boss1');
    if (this.level() >= 5) this.unlock('level5');
    if (s.noHintTasks >= 5) this.unlock('no_hints5');
    if (LOCATIONS.every(l => s.bosses[l.id])) this.unlock('finish');
  },

  /* ---------- Верхняя панель ---------- */
  renderTop() {
    const s = this.s, l = this.level(), [a, b] = this.levelSpan(l);
    const pct = Math.round((s.xp - a) / (b - a) * 100);
    $('#top').innerHTML = `
      <button class="me" data-go="profile" aria-label="Профиль героя">${heroSVG(s.skin, 40)}<span class="me-txt"><b>${esc(s.name || 'Герой')}</b><small>Уровень ${l}</small></span></button>
      <div class="xp" data-res="xp" title="Опыт: ${s.xp} XP"><div class="xp-bar"><i style="width:${pct}%"></i></div><small>${s.xp - a} / ${b - a} XP до уровня ${l + 1}</small></div>
      <div class="res-row">
        <span class="res" data-res="blocks" title="Блоки">${sprite('block', 20)}<b>${s.blocks}</b></span>
        <span class="res" data-res="ore" title="Руда">${sprite('ore', 20)}<b>${s.ore}</b></span>
        <span class="res" data-res="gems" title="Кристаллы">${sprite('gem', 20)}<b>${s.gems}</b></span>
      </div>
      <nav class="nav">
        <button data-go="map" class="${this.view === 'map' ? 'cur' : ''}">${sprite('flag', 18)}<span>Карта</span></button>
        <button data-go="sandbox" class="${this.view === 'sandbox' ? 'cur' : ''}">${sprite('block', 18)}<span>Песочница</span></button>
        <button data-go="base" class="${this.view === 'base' ? 'cur' : ''}">${sprite('chest', 18)}<span>База</span></button>
        <button data-go="cheat">${sprite('sign', 18)}<span>Шпаргалка</span></button>
        <button data-go="sound" aria-label="${s.sound ? 'Выключить звук' : 'Включить звук'}" title="Звук">${s.sound ? '♪' : '×'}<span>Звук</span></button>
      </nav>`;
  },

  /* ---------- Навигация ---------- */
  go(view, arg) {
    if (view === 'cheat') return this.cheatSheet();
    if (view === 'sound') { this.s.sound = !this.s.sound; Sfx.on = this.s.sound; this.save(); this.renderTop(); if (this.s.sound) Sfx.coin(); return; }
    this.view = view; this.arg = arg;
    const v = $('#view'); v.innerHTML = ''; v.className = 'view view-' + view;
    ({ map: () => this.viewMap(arg), topic: () => this.viewTopic(arg), boss: () => this.viewBoss(arg), sandbox: () => this.viewSandbox(), base: () => this.viewBase(), profile: () => this.viewProfile() })[view]();
    this.renderTop();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  },
  openItem(item) { if (item.kind === 'topic') this.go('topic', item.id); else this.go('boss', item.id); },

  /* ---------- Карта мира ---------- */
  viewMap(locId) {
    const s = this.s, next = this.nextItem();
    const curLoc = locId || (next ? LOC_OF[next.id].id : LOCATIONS[LOCATIONS.length - 1].id);
    const v = $('#view');
    const greet = !next ? `Ты прошёл всю Блокодию, ${esc(s.name || 'герой')}! Песочница и Мастерская ждут твоих проектов.`
      : next.id === 'print' ? `Привет, ${esc(s.name || 'герой')}! Начнём с Шахты — там тебя ждёт первая команда.`
        : next.kind === 'boss' ? `В локации «${LOC_OF[next.id].name}» проснулся ${BOSSES[next.id].name}! Готов к бою?`
          : `Следующий уровень: «${TOPIC[next.id].title}». Вперёд, ${esc(s.name || 'герой')}!`;
    v.innerHTML = `
      <section class="map-hero">
        <div class="hero-bot">${robotSVG(88)}</div>
        <div class="bubble"><p>${greet}</p>${next ? `<button class="btn btn-big" id="cont">${next.kind === 'boss' ? 'В бой с боссом' : 'Продолжить'}</button>` : `<button class="btn btn-big" data-go="sandbox">Открыть Песочницу</button>`}</div>
      </section>
      <section class="world" aria-label="Карта локаций">
        ${LOCATIONS.map((l, i) => {
      const items = [...l.topics, l.boss].map(id => ORDER.find(o => o.id === id));
      const doneN = items.filter(it => this.isDone(it)).length;
      const open = this.isOpen(items[0]);
      return `<button class="isle ${open ? '' : 'locked'} ${l.id === curLoc ? 'cur' : ''} ${s.bosses[l.id] ? 'cleared' : ''}" data-loc="${l.id}" style="--lc:${l.color};--ld:${l.deep}">
            <span class="isle-sky">${sprite(l.icon, 56)}</span>
            <span class="isle-name">${l.name}</span>
            <span class="isle-blurb">${l.blurb}</span>
            <span class="isle-prog"><i style="width:${doneN / items.length * 100}%"></i></span>
            ${open ? '' : `<span class="isle-lock">${sprite('lock', 28)}</span>`}
          </button>`;
    }).join('')}
      </section>
      <section class="loc-detail" id="locd"></section>`;
    const cont = $('#cont', v); if (cont) cont.onclick = () => this.openItem(next);
    $$('.isle', v).forEach(b => b.onclick = () => { $$('.isle', v).forEach(x => x.classList.remove('cur')); b.classList.add('cur'); this.renderLoc(b.dataset.loc); Sfx.click(); });
    this.renderLoc(curLoc);
  },
  renderLoc(locId) {
    const l = LOCATIONS.find(x => x.id === locId), el = $('#locd');
    const tile = id => {
      const it = ORDER.find(o => o.id === id); const done = this.isDone(it), open = this.isOpen(it);
      const st = done ? 'done' : open ? 'open' : 'locked';
      if (it.kind === 'boss') {
        const b = BOSSES[id];
        return `<button class="lvl boss ${st}" data-item="${id}" ${open ? '' : 'disabled'}>
          <span class="lvl-ic">${bossSVG(44, b.hue)}</span><span class="lvl-t"><b>Босс: ${b.name}</b><small>${done ? 'Повержен!' : open ? 'Задача на всё, что ты узнал здесь' : 'Пройди все уровни локации'}</small></span>
          <span class="lvl-st">${done ? sprite('star', 26) : open ? '<i class="play">▶</i>' : sprite('lock', 22)}</span></button>`;
      }
      const t = TOPIC[id], q = this.s.quiz[id];
      return `<button class="lvl ${st}" data-item="${id}" ${open ? '' : 'disabled'}>
        <span class="lvl-n">${TOPIC_NUM[id]}</span><span class="lvl-t"><b>${t.title}</b><small>${t.sub}</small></span>
        <span class="lvl-st">${done ? `<span class="stars">${[0, 1, 2].map(i => `<i class="${i < (q || 0) ? 'on' : ''}">★</i>`).join('')}</span>` : open ? '<i class="play">▶</i>' : sprite('lock', 22)}</span></button>`;
    };
    el.innerHTML = `<h2 class="loc-h" style="--lc:${l.color}">${sprite(l.icon, 30)} ${l.name}</h2><div class="lvls">${[...l.topics, l.boss].map(tile).join('')}</div>`;
    $$('.lvl', el).forEach(b => b.onclick = () => { Sfx.click(); this.openItem(ORDER.find(o => o.id === b.dataset.item)); });
  },

  /* ---------- Урок ---------- */
  viewTopic(id) {
    const t = TOPIC[id], s = this.s, loc = LOC_OF[id];
    const stages = [['story', 'История'], ['explain', 'Объяснение'], ...(t.widget ? [['try', 'Попробуй']] : []), ['task', 'Задание'], ['quiz', 'Викторина']];
    if (s.stage[id] === undefined) { s.stage[id] = 0; this.save(); }
    let cur = this.s.done[id] ? 0 : Math.min(s.stage[id], stages.length - 1);
    const v = $('#view');
    v.innerHTML = `<div class="lesson" style="--lc:${loc.color};--ld:${loc.deep}">
      <div class="crumbs"><button class="link" data-go="map">← Карта</button><span>${loc.name} · уровень ${TOPIC_NUM[id]} из ${TOPICS.length}</span></div>
      <header class="lesson-h"><h1>${t.title}</h1><code class="sub">${t.sub}</code></header>
      <ol class="stages">${stages.map(([k, n], i) => `<li><button data-st="${i}">${n}</button></li>`).join('')}</ol>
      <div class="stage-body"></div>
      <div class="stage-nav"><button class="btn btn-ghost" id="prev">Назад</button><span class="rn-sp"></span><button class="btn" id="next">Дальше</button></div></div>`;
    const body = $('.stage-body', v);
    const maxReached = () => (this.s.done[id] ? stages.length - 1 : this.s.stage[id]);
    const show = i => {
      cur = i; body.innerHTML = '';
      $$('.stages button', v).forEach((b, j) => { b.classList.toggle('cur', j === i); b.classList.toggle('seen', j <= maxReached()); b.disabled = j > maxReached(); });
      const k = stages[i][0];
      this.renderStage(k, t, body, () => { gate(); });
      gate();
      $('#prev', v).style.visibility = i ? 'visible' : 'hidden';
      v.querySelector('.lesson-h').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    };
    const gate = () => {
      const k = stages[cur][0]; const nx = $('#next', v);
      nx.hidden = k === 'quiz';
      nx.disabled = k === 'task' && !(this.s.tasks[id] && this.s.tasks[id].done);
      nx.textContent = k === 'task' && nx.disabled ? 'Сначала реши задание' : 'Дальше';
    };
    $('#next', v).onclick = () => {
      if (cur < stages.length - 1) {
        if (this.s.stage[id] < cur + 1) { this.s.stage[id] = cur + 1; this.save(); }
        Sfx.click(); show(cur + 1);
      }
    };
    $('#prev', v).onclick = () => { if (cur > 0) show(cur - 1); };
    $$('.stages button', v).forEach(b => b.onclick = () => show(+b.dataset.st));
    show(cur);
  },
  renderStage(k, t, body, onUpdate) {
    const name = this.s.name || 'герой';
    if (k === 'story') {
      body.innerHTML = `<div class="story">${t.story.map((line, i) => `<div class="say-row" style="animation-delay:${i * 0.35}s">${i === 0 ? `<div class="say-bot">${robotSVG(72)}</div>` : '<div class="say-bot"></div>'}<div class="bubble">${esc(line.replace('{игрок}', name))}</div></div>`).join('')}</div>`;
    }
    if (k === 'explain') {
      body.innerHTML = `<div class="explain panel-pad">${t.explain}</div>`;
      highlightAll(body);
    }
    if (k === 'try') {
      body.innerHTML = `<div class="try panel-pad"><p class="w-intro">${robotSVG(28)} Поиграй с этим механизмом — так легче понять, как всё устроено.</p><div class="widget"></div></div>`;
      const api = { done: () => { if (this.s.widgets[t.id]) return; this.s.widgets[t.id] = true; this.save(); toast('Механизм изучен! +10 XP', 'gear'); this.award({ xp: 10 }); } };
      WIDGETS[t.widget]($('.widget', body), api);
    }
    if (k === 'task') this.renderTask(body, t.id, t.task, { canvas: t.canvas, boss: false, onSolved: onUpdate });
    if (k === 'quiz') this.renderQuiz(body, t);
  },

  /* ---------- Задание с редактором ---------- */
  renderTask(body, id, task, opt) {
    const st = this.s.tasks[id] || (this.s.tasks[id] = { done: false, hints: 0, err: false });
    body.innerHTML = `<div class="task">
      <div class="task-card">${opt.boss ? '' : `<div class="task-ic">${sprite('sign', 34)}</div>`}<div><h3>${opt.boss ? 'Задача босса' : 'Задание'}</h3><p>${task.text}</p>${st.done ? '<p class="good">Задание уже выполнено. Можешь попробовать решить его по-другому!</p>' : ''}</div></div>
      <div class="hints"><span class="hints-l">Подсказки:</span>
        <button class="chip" data-h="1">1 · намёк</button><button class="chip" data-h="2">2 · заготовка</button><button class="chip" data-h="3">3 · решение</button></div>
      <div class="hint-box" hidden></div>
      <div class="task-run"></div>
      <div class="verdict" aria-live="polite"></div></div>`;
    const hb = $('.hint-box', body), verdict = $('.verdict', body);
    let confirm3 = false;
    const showHint = n => {
      const hnt = task.hints[n - 1];
      hb.hidden = false;
      hb.innerHTML = `<div class="hint-bot">${robotSVG(32)}</div><div><b>Подсказка ${n}.</b> ${hnt.text}${hnt.code ? `<pre class="py">${esc(hnt.code)}</pre><button class="btn btn-sm btn-ghost" id="ins">${n === 3 ? 'Вставить решение в редактор' : 'Вставить заготовку в редактор'}</button>` : ''}</div>`;
      highlightAll(hb);
      const ins = $('#ins', hb); if (ins) ins.onclick = () => { runner.code = hnt.code; Sfx.click(); };
      $$('.hints .chip', body).forEach(c => c.classList.toggle('sel', +c.dataset.h === n));
    };
    $$('.hints .chip', body).forEach(c => c.onclick = () => {
      const n = +c.dataset.h;
      if (n > st.hints + 1) { hb.hidden = false; hb.innerHTML = `<div class="hint-bot">${robotSVG(32)}</div><div>Сначала открой подсказку ${st.hints + 1}.</div>`; return; }
      if (n === 3 && st.hints < 3 && !st.done && !confirm3) { confirm3 = true; hb.hidden = false; hb.innerHTML = `<div class="hint-bot">${robotSVG(32)}</div><div>За готовое решение дают вдвое меньше опыта. Может, ещё разок попробуешь сам? Если нет — нажми «3 · решение» ещё раз.</div>`; return; }
      if (n > st.hints && !st.done) { st.hints = n; this.save(); }
      Sfx.click(); showHint(n);
    });
    const runner = new Runner($('.task-run', body), {
      code: this.s.codes[id] !== undefined ? this.s.codes[id] : task.starter,
      canvas: opt.canvas, checkLabel: 'Проверить',
      onChange: v => { this.s.codes[id] = v; clearTimeout(this._sv); this._sv = setTimeout(() => this.save(), 400); },
      onFinish: (r, mode) => { if (r.error && r.error.pyType !== 'Stopped' && !st.done) { st.err = true; this.save(); } },
      onCheck: r => {
        if (r.error) {
          if (r.error.pyType === 'Stopped') return;
          verdict.innerHTML = `<div class="v-bad">${robotSVG(36)}<div><b>Сначала исправь ошибку</b><p>Программа остановилась на строке ${r.error.line || '?'}. Подробности — в окне вывода.</p></div></div>`;
          return;
        }
        let res;
        try { res = task.check(r, CheckCtx); } catch (e) { res = { ok: false, msg: 'Проверка споткнулась: ' + (e.message || e) }; }
        if (!res.ok) {
          if (!st.done) { st.err = true; this.save(); }
          Sfx.err();
          verdict.innerHTML = `<div class="v-bad">${robotSVG(36)}<div><b>Почти! Есть что поправить</b><p>${esc(res.msg)}</p></div></div>`;
          return;
        }
        Sfx.ok();
        verdict.innerHTML = `<div class="v-good">${sprite('star', 36)}<div><b>${opt.boss ? 'Босс повержен!' : 'Отлично! Задание выполнено!'}</b><p>${st.done ? 'Ты решил его снова — так держать.' : 'Болтик доволен твоим кодом.'}</p></div></div>`;
        if (!st.done) {
          st.done = true;
          const mult = st.hints >= 3 ? 0.5 : st.hints === 2 ? 0.8 : 1;
          if (!st.hints) this.s.noHintTasks++;
          this.save();
          if (!st.err) this.unlock('no_errors'); else this.unlock('fixer');
          opt.onSolved && opt.onSolved(verdict, mult, st);
          if (!opt.boss) {
            const rw = { xp: Math.round(40 * mult), blocks: 8, ore: 3 };
            this.award(rw, verdict); this.checkDerived();
            rewardModal('Задание выполнено!', rw, mult < 1 ? `С подсказками опыт меньше: ×${mult}.` : 'Без готового решения — полный опыт!', 'Дальше — к викторине', () => { const n = $('#next'); if (n && !n.disabled) n.click(); });
          }
        }
      },
    });
  },

  /* ---------- Викторина ---------- */
  renderQuiz(body, t) {
    let qi = 0, score = 0;
    const draw = () => {
      if (qi >= t.quiz.length) return finish();
      const q = t.quiz[qi];
      body.innerHTML = `<div class="quiz panel-pad"><div class="q-prog">Вопрос ${qi + 1} из ${t.quiz.length}</div><h3>${esc(q.q)}</h3>
        <div class="q-opts">${q.a.map((a, i) => `<button class="q-opt" data-i="${i}">${esc(a)}</button>`).join('')}</div><div class="q-why"></div></div>`;
      $$('.q-opt', body).forEach(b => b.onclick = () => {
        const i = +b.dataset.i, ok = i === q.ok;
        $$('.q-opt', body).forEach(x => { x.disabled = true; if (+x.dataset.i === q.ok) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong'); else score++;
        ok ? Sfx.coin() : Sfx.err();
        $('.q-why', body).innerHTML = `<p class="${ok ? 'good' : 'bad'}">${ok ? 'Верно!' : 'Не совсем.'} ${esc(q.why)}</p><button class="btn">${qi + 1 < t.quiz.length ? 'Следующий вопрос' : 'Итоги'}</button>`;
        $('.q-why .btn', body).onclick = () => { qi++; draw(); };
      });
    };
    const finish = () => {
      const first = !this.s.done[t.id];
      const prevBest = this.s.quiz[t.id] || 0;
      this.s.quiz[t.id] = Math.max(prevBest, score);
      body.innerHTML = `<div class="quiz panel-pad quiz-end"><div class="stars big">${t.quiz.map((_, i) => `<i class="${i < score ? 'on' : ''}">★</i>`).join('')}</div><h3>${score} из ${t.quiz.length} верно</h3>
        <p>${score === t.quiz.length ? 'Идеально! Ты отлично понял тему.' : 'Хороший результат! Викторину можно перепройти ради всех звёзд.'}</p>
        <div class="w-row center"><button class="btn btn-ghost" id="again">Пройти ещё раз</button><button class="btn btn-big" id="fin">${first ? 'Завершить уровень' : 'На карту'}</button></div></div>`;
      $('#again', body).onclick = () => { qi = 0; score = 0; draw(); };
      $('#fin', body).onclick = () => this.completeTopic(t, score, prevBest, $('#fin', body));
    };
    draw();
  },
  completeTopic(t, score, prevBest, btn) {
    const first = !this.s.done[t.id];
    if (!first) { this.go('map', LOC_OF[t.id].id); return; }
    this.s.done[t.id] = true;
    const add = Math.max(0, score - prevBest);
    this.s.quizCorrect += score;
    this.save();
    const rw = { xp: score * 10, blocks: 5 + score };
    this.award(rw, btn); this.checkDerived(); Sfx.ok(); FX.fireworks();
    const next = this.nextItem();
    const loc = LOC_OF[t.id];
    const bossNext = next && next.kind === 'boss' && LOC_OF[next.id] === loc;
    rewardModal(`Уровень «${t.title}» пройден!`, rw, bossNext ? `Все уровни локации «${loc.name}» пройдены. Проснулся ${BOSSES[next.id].name}!` : `Викторина: ${score} из ${t.quiz.length}.`,
      next ? (bossNext ? 'Сразиться с боссом' : 'Следующий уровень') : 'На карту',
      () => (next ? this.openItem(next) : this.go('map')), 'На карту', () => this.go('map', loc.id));
  },

  /* ---------- Босс ---------- */
  viewBoss(id) {
    const b = BOSSES[id], loc = LOC_OF[id], v = $('#view'), beaten = !!this.s.bosses[loc.id];
    v.innerHTML = `<div class="lesson boss-fight" style="--lc:${loc.color};--ld:${loc.deep}">
      <div class="crumbs"><button class="link" data-go="map">← Карта</button><span>${loc.name} · битва с боссом</span></div>
      <section class="boss-intro"><div class="boss-sprite ${beaten ? 'beaten' : ''}">${bossSVG(120, b.hue)}<div class="boss-hp"><i style="width:${beaten ? 0 : 100}%"></i></div></div>
        <div class="bubble boss-bubble"><h1>${b.name}</h1><p>${b.story}</p></div></section>
      <div class="stage-body"></div></div>`;
    this.renderTask($('.stage-body', v), id, b.task, {
      boss: true, canvas: id === 'boss_studio',
      onSolved: (el, mult) => {
        if (this.s.bosses[loc.id]) return;
        this.s.bosses[loc.id] = true; this.save();
        const spr = $('.boss-sprite', v); spr.classList.add('beaten'); $('.boss-hp i', v).style.width = '0%';
        const r = spr.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 70, [b.hue[0], b.hue[1], '#f7c531', '#ffffff']);
        Sfx.boss(); setTimeout(() => { Sfx.level(); FX.fireworks(); }, 700);
        const rw = { xp: Math.round(100 * mult), blocks: 25, ore: 10, gems: 1 };
        this.award(rw, el); this.checkDerived();
        const skinId = { mine: 'miner', forge: 'smith', arena: 'tactic', factory: 'engineer', studio: 'artist' }[loc.id];
        const all = LOCATIONS.every(l => this.s.bosses[l.id]);
        setTimeout(() => rewardModal(`${b.name} повержен!`, rw,
          `<div class="skin-get">${heroSVG(skinId, 72)}<div>Новый скин: <b>${SKINS[skinId].name}</b>. Надень его в профиле!</div></div>${all ? '<p class="good">Ты победил всех багов Блокодии! Ты настоящий программист.</p>' : ''}`,
          all ? 'Открыть профиль' : 'Дальше по карте', () => (all ? this.go('profile') : this.go('map')), 'Надеть скин', () => { this.s.skin = skinId; this.save(); this.go('profile'); }), 900);
      },
    });
  },

  /* ---------- Песочница ---------- */
  viewSandbox() {
    const v = $('#view');
    v.innerHTML = `<div class="sandbox"><header class="lesson-h"><h1>Песочница</h1><p class="lead">Свободный режим: пиши любой код. Здесь работают все команды — и холст тоже.</p></header>
      <div class="w-row"><label>Пример: <select class="inp sm" id="ex"><option value="">— выбери —</option>${SANDBOX_EXAMPLES.map((e, i) => `<option value="${i}">${esc(e.name)}</option>`).join('')}</select></label></div><div class="sb-run"></div></div>`;
    const runner = new Runner($('.sb-run', v), {
      code: this.s.sandbox || '# Пиши здесь что угодно!\nprint("Привет из Песочницы!")\n',
      canvas: true,
      onChange: c => { this.s.sandbox = c; clearTimeout(this._sv); this._sv = setTimeout(() => this.save(), 400); },
      onFinish: () => this.unlock('sandbox'),
    });
    $('#ex', v).onchange = e => { const ex = SANDBOX_EXAMPLES[e.target.value]; if (ex) { runner.code = ex.code; Sfx.click(); } };
  },

  /* ---------- База и крафт ---------- */
  viewBase() {
    const v = $('#view'), s = this.s;
    const slots = Array.from({ length: 16 }, (_, i) => s.crafted[i]);
    v.innerHTML = `<div class="base"><header class="lesson-h"><h1>Твоя база</h1><p class="lead">Крафти украшения из ресурсов, которые получаешь за задания.</p></header>
      <div class="base-scene"><div class="base-hero">${heroSVG(s.skin, 64)}</div><div class="base-grid">${slots.map(c => `<div class="bslot">${c ? sprite(CRAFTS.find(x => x.id === c).sprite, 44) : ''}</div>`).join('')}</div></div>
      <h2 class="sec-h">Верстак</h2>
      <div class="crafts">${CRAFTS.map(c => {
      const can = s.blocks >= c.cost.blocks && s.ore >= c.cost.ore && s.gems >= (c.cost.gems || 0) && s.crafted.length < 16;
      return `<div class="craft ${can ? '' : 'no'}">${sprite(c.sprite, 48)}<b>${c.name}</b>
          <span class="cost">${sprite('block', 16)}${c.cost.blocks} ${c.cost.ore ? sprite('ore', 16) + c.cost.ore : ''} ${c.cost.gems ? sprite('gem', 16) + c.cost.gems : ''}</span>
          <button class="btn btn-sm" data-c="${c.id}" ${can ? '' : 'disabled'}>Скрафтить</button></div>`;
    }).join('')}</div></div>`;
    $$('.craft .btn', v).forEach(b => b.onclick = () => {
      const c = CRAFTS.find(x => x.id === b.dataset.c);
      s.blocks -= c.cost.blocks; s.ore -= c.cost.ore; s.gems -= c.cost.gems || 0; s.crafted.push(c.id); this.save();
      Sfx.ok(); const r = b.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top, 30);
      this.unlock('crafter'); toast(`Скрафчено: ${c.name}`, c.sprite);
      this.go('base');
    });
  },

  /* ---------- Профиль: скины и достижения ---------- */
  viewProfile() {
    const v = $('#view'), s = this.s, own = this.skinsOwned();
    const solved = Object.values(s.tasks).filter(t => t.done).length;
    v.innerHTML = `<div class="profile">
      <section class="prof-top"><div class="prof-hero">${heroSVG(s.skin, 120)}</div>
        <div><label class="name-edit">Имя героя <input class="inp" id="pn" maxlength="16" value="${esc(s.name)}"></label>
        <div class="stats"><span><b>${this.level()}</b>уровень</span><span><b>${s.xp}</b>опыт</span><span><b>${solved}</b>заданий</span><span><b>${Object.keys(s.bosses).length}/5</b>боссов</span></div></div></section>
      <h2 class="sec-h">Скины</h2>
      <div class="skins">${Object.entries(SKINS).map(([id, k]) => {
      const has = own.includes(id);
      return `<button class="skin ${has ? '' : 'locked'} ${s.skin === id ? 'cur' : ''}" data-s="${id}" ${has ? '' : 'disabled'}>${heroSVG(id, 56)}<b>${k.name}</b><small>${has ? (s.skin === id ? 'Надет' : 'Надеть') : k.how}</small></button>`;
    }).join('')}</div>
      <h2 class="sec-h">Достижения <small>${Object.keys(s.ach).length} из ${ACHIEVEMENTS.length}</small></h2>
      <div class="achs">${ACHIEVEMENTS.map(a => `<div class="ach ${s.ach[a.id] ? 'got' : ''}">${sprite(a.icon, 36)}<div><b>${a.name}</b><small>${a.desc}</small></div></div>`).join('')}</div>
      <div class="danger"><button class="btn btn-ghost btn-sm" id="reset">Начать игру заново</button></div></div>`;
    $('#pn', v).onchange = e => { s.name = e.target.value.trim(); this.save(); this.renderTop(); };
    $$('.skin', v).forEach(b => b.onclick = () => { s.skin = b.dataset.s; this.save(); Sfx.coin(); this.go('profile'); });
    let sure = false;
    $('#reset', v).onclick = e => {
      if (!sure) { sure = true; e.target.textContent = 'Точно? Весь прогресс сотрётся. Нажми ещё раз'; return; }
      const theme = s.theme; this.s = DEFAULT_STATE(); this.s.theme = theme; this.save(); location.reload();
    };
  },

  /* ---------- Шпаргалка ---------- */
  cheatSheet() {
    const seen = TOPICS.filter(t => this.s.stage[t.id] !== undefined || this.s.done[t.id]);
    const html = seen.length ? `<div class="cheat">${seen.map(t => `<div class="cheat-c"><b>${t.sub}</b><pre class="py">${esc(t.cheat.code)}</pre><small>${t.cheat.note}</small></div>`).join('')}</div>`
      : '<p>Шпаргалка пока пустая. Открой первый уровень — и сюда добавятся изученные команды.</p>';
    modal(`<h2>Шпаргалка</h2><p class="lead">Все команды, которые ты уже открыл.</p>${html}`, [['Закрыть']], 'wide');
  },

  /* ---------- Сохранение рисунка ---------- */
  async saveDrawing(pc) {
    this.unlock('artist');
    const cv = pc.toPNG();
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (window.claude && this.downloads) {
      const dl = await Promise.race([this.downloads, new Promise(r => setTimeout(() => r(null), 1500))]);
      if (dl) {
        try { await dl.save({ filename: 'blokodia-risunok.png', data: blob }); toast('Рисунок сохранён!', 'palette'); return; }
        catch (e) { if (e && e.code === 'declined') return; }
      }
    }
    if (!window.claude) { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'blokodia-risunok.png'; document.body.appendChild(a); a.click(); a.remove(); return; }
    modal(`<h2>Твой рисунок</h2><p>Нажми на картинку правой кнопкой мыши (или подержи палец) и выбери «Сохранить изображение».</p><img class="saved-img" src="${cv.toDataURL('image/png')}" alt="Твой пиксельный рисунок">`, [['Готово']]);
  },
};

/* ---------- Окна и уведомления ---------- */
function modal(html, buttons, cls) {
  return new Promise(res => {
    const root = $('#modal-root');
    const m = h('div', { class: 'modal-bg' });
    m.innerHTML = `<div class="modal ${cls || ''}" role="dialog" aria-modal="true">${html}<div class="modal-btns">${buttons.map(([t], i) => `<button class="btn ${i === buttons.length - 1 ? '' : 'btn-ghost'}" data-i="${i}">${t}</button>`).join('')}</div></div>`;
    root.appendChild(m);
    highlightAll(m);
    const close = i => { m.remove(); document.removeEventListener('keydown', onKey); res(i); const b = buttons[i]; if (b && b[1]) b[1](); };
    const onKey = e => { if (e.key === 'Escape') close(-1); };
    document.addEventListener('keydown', onKey);
    $$('.modal-btns .btn', m).forEach(b => b.onclick = () => close(+b.dataset.i));
    m.addEventListener('click', e => { if (e.target === m) close(-1); });
    setTimeout(() => { const last = $$('.modal-btns .btn', m).pop(); last && last.focus(); }, 30);
  });
}
function rewardModal(title, rw, note, okText, okFn, altText, altFn) {
  const parts = [];
  if (rw.xp) parts.push(`<span>${sprite('star', 30)}<b>+${rw.xp}</b> опыта</span>`);
  if (rw.blocks) parts.push(`<span>${sprite('block', 30)}<b>+${rw.blocks}</b> блоков</span>`);
  if (rw.ore) parts.push(`<span>${sprite('ore', 30)}<b>+${rw.ore}</b> руды</span>`);
  if (rw.gems) parts.push(`<span>${sprite('gem', 30)}<b>+${rw.gems}</b> кристалл</span>`);
  const btns = altText ? [[altText, altFn], [okText, okFn]] : [[okText || 'Дальше', okFn]];
  setTimeout(() => modal(`<div class="reward"><div class="reward-chest">${sprite('chest', 84)}</div><h2>${title}</h2><div class="loot">${parts.join('')}</div>${note ? `<div class="reward-note">${note}</div>` : ''}</div>`, btns), 350);
}
function toast(title, icon, sub) {
  const t = h('div', { class: 'toast' }, `${sprite(icon || 'star', 32)}<div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`);
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('hide'), 3600);
  setTimeout(() => t.remove(), 4200);
}

/* ---------- Запуск ---------- */
function boot() {
  App.load(); FX.init();
  if (App.s.theme) document.documentElement.dataset.theme = App.s.theme;
  // Возможность сохранить рисунок через claude.ai (если доступна)
  if (window.claude && window.claude.use) App.downloads = window.claude.use('downloads').catch(() => null);
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { Sfx.click(); App.go(g.dataset.go); } });
  App.go('map');
  // Заставка «загрузка мира»
  const intro = $('#intro');
  $('.intro-blocks', intro).innerHTML = ['block', 'ore', 'block', 'gem', 'block', 'ore', 'block'].map((b, i) => `<span style="animation-delay:${i * 0.12}s">${sprite(b, 32)}</span>`).join('');
  const finishIntro = () => {
    intro.classList.add('gone'); setTimeout(() => intro.remove(), 600);
    if (!App.s.name) askName();
  };
  setTimeout(finishIntro, reduceMotion() ? 200 : 1700);
}
function askName() {
  const m = h('div', { class: 'modal-bg' });
  m.innerHTML = `<div class="modal welcome" role="dialog" aria-modal="true"><div class="welcome-bot">${robotSVG(96)}</div>
    <h2>Добро пожаловать в Блокодию!</h2><p>Я Болтик, робот-инженер. Вместе мы пройдём шахту, кузницу, арену, завод и мастерскую — и ты научишься программировать на Python.</p>
    <label class="name-edit">Как тебя зовут? <input class="inp" maxlength="16" placeholder="Твоё имя"></label>
    <div class="modal-btns"><button class="btn btn-big">Начать приключение</button></div></div>`;
  $('#modal-root').appendChild(m);
  const inp = $('input', m); setTimeout(() => inp.focus(), 50);
  const go = () => { App.s.name = inp.value.trim() || 'Герой'; App.save(); m.remove(); Sfx.ok(); App.go('map'); };
  $('button', m).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}
document.addEventListener('DOMContentLoaded', boot);

</script>
