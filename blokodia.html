<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Блокодия — приключение с Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   СТИЛЬ БЛОКОДИИ: пиксельные «зубчатые» рамки, день/ночь, крупные кнопки
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #9fd8f0; --bg2: #c9ecf8; --ground: #5bb441; --ground2: #3b7f2c; --dirt: #8a5a35;
  --panel: #fbfdff; --panel2: #e8f3f9; --panel3: #d6e9f3;
  --ink: #1d1b26; --text: #1d1b26; --muted: #4a5468;
  --accent: #2fa58a; --accent-d: #1d6e5c; --gold: #f7c531; --gold-d: #c98f12; --red: #e0473a; --blue: #3d8fe0;
  --good: #1f8a4c; --bad: #c0352a; --good-bg: #dff5e4; --bad-bg: #fde4e1;
  --code-bg: #1b1f2e; --code-bg2: #151826; --code-text: #e8ecf5; --code-muted: #6f7a93;
  --t-kw: #ff9f43; --t-str: #9be05a; --t-num: #f7c531; --t-bi: #5fd6e8; --t-com: #7f8aa3; --t-def: #ff8fc0; --t-fx: #ffd27a;
  --px: 4px;
  --f-pixel: 'Press Start 2P', 'Courier New', monospace;
  --f-body: 'Rubik', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-code: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141a2e; --bg2: #1c2440; --ground: #2f6b3a; --ground2: #1f4a28; --dirt: #5e3b22;
    --panel: #222a45; --panel2: #2a3456; --panel3: #334068;
    --ink: #05070f; --text: #eef3ff; --muted: #a9b4d0;
    --accent: #38b896; --accent-d: #1d6e5c; --good: #7be3a0; --bad: #ff8a7f; --good-bg: #1d3a2c; --bad-bg: #432128;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141a2e; --bg2: #1c2440; --ground: #2f6b3a; --ground2: #1f4a28; --dirt: #5e3b22;
  --panel: #222a45; --panel2: #2a3456; --panel3: #334068;
  --ink: #05070f; --text: #eef3ff; --muted: #a9b4d0;
  --accent: #38b896; --accent-d: #1d6e5c; --good: #7be3a0; --bad: #ff8a7f; --good-bg: #1d3a2c; --bad-bg: #432128;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 90px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  font-family: var(--f-body); font-size: 17px; line-height: 1.5; color: var(--text);
  background: linear-gradient(var(--bg2), var(--bg) 340px) fixed, var(--bg);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
svg.px { display: block; image-rendering: pixelated; flex: none; }
code { font-family: var(--f-code); font-size: .9em; background: var(--panel2); padding: 1px 6px; border-radius: 0; box-shadow: 0 0 0 2px var(--panel3); }
h1, h2, h3 { line-height: 1.25; }
[hidden] { display: none !important; }

/* ---------- Пиксельная «зубчатая» рамка ---------- */
.pbox, .panel, .bubble, .task-card, .isle, .lvl, .modal, .toast, .explain, .try, .quiz, .story .bubble, .craft, .skin, .ach, .base-scene, .loc-detail, .cheat-c, .hint-box, .verdict > div, .prof-top {
  background: var(--panel);
  box-shadow: 0 calc(-1 * var(--px)) 0 var(--ink), 0 var(--px) 0 var(--ink), calc(-1 * var(--px)) 0 0 var(--ink), var(--px) 0 0 var(--ink), 0 calc(var(--px) * 3) 0 rgba(0, 0, 0, .18);
  margin: var(--px);
}

/* ---------- Кнопки ---------- */
.btn {
  --b: var(--accent); --bd: var(--accent-d);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; background: var(--b); color: #fff; font-weight: 700; font-size: 16px; padding: 10px 18px; min-height: 46px;
  box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset 0 -5px 0 var(--bd), inset 0 3px 0 rgba(255, 255, 255, .25);
  margin: 3px; transition: transform .06s; text-shadow: 0 2px 0 rgba(0, 0, 0, .25);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset 0 -2px 0 var(--bd); }
.btn:disabled { filter: grayscale(.8) brightness(.9); opacity: .6; cursor: not-allowed; transform: none; }
.btn-ghost { --b: var(--panel2); --bd: var(--panel3); color: var(--text); text-shadow: none; }
.btn-run { --b: #3fa34d; --bd: #2a7a36; }
.btn-check { --b: var(--gold); --bd: var(--gold-d); color: #1d1b26; text-shadow: none; }
.btn-big { font-size: 18px; padding: 14px 24px; min-height: 56px; }
.btn-sm { font-size: 14px; min-height: 36px; padding: 6px 12px; }
.link { background: none; border: 0; color: var(--text); font-weight: 600; padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; }
.chip {
  border: 0; background: var(--panel2); padding: 7px 12px; margin: 3px; font-size: 15px; min-height: 40px;
  box-shadow: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink), inset 0 -3px 0 var(--panel3);
  font-family: var(--f-code);
}
.chip.sel, .chip:hover { background: var(--gold); color: #1d1b26; }
.chip .t-kw, .chip .t-bi, .chip .t-str, .chip .t-num, .chip .t-fx { color: inherit; }
.mini { border: 0; background: none; color: var(--code-muted); font-size: 13px; text-decoration: underline; padding: 2px 4px; }
.inp {
  border: 0; background: var(--panel); padding: 9px 12px; min-height: 44px; font-size: 16px; min-width: 0;
  box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), inset 0 3px 0 rgba(0, 0, 0, .08);
  margin: 3px;
}
.inp.sm { width: 9em; } .inp.xs { width: 4.2em; text-align: center; }

/* ---------- Верхняя панель ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--panel);
  display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap;
  box-shadow: 0 4px 0 var(--ink), 0 9px 0 rgba(0, 0, 0, .12);
}
.me { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 2px; }
.me-txt { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }
.me-txt b { font-size: 16px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-txt small { font-family: var(--f-pixel); font-size: 9px; color: var(--muted); margin-top: 4px; }
.xp { flex: 1 1 160px; min-width: 140px; max-width: 320px; }
.xp-bar { height: 16px; background: var(--panel3); box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); margin: 3px; overflow: hidden; }
.xp-bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--gold) 0 12px, #ffd85e 12px 16px); box-shadow: inset 0 -4px 0 var(--gold-d); transition: width .6s; }
.xp small { font-size: 12px; color: var(--muted); }
.res-row { display: flex; gap: 6px; }
.res { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; background: var(--panel2); font-weight: 700; font-variant-numeric: tabular-nums; }
.res.pulse { animation: pulse .4s; }
@keyframes pulse { 50% { transform: scale(1.25); background: var(--gold); color: #1d1b26; } }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; font-weight: 600; font-size: 15px; min-height: 44px; color: var(--text); }
.nav button:hover, .nav button.cur { background: var(--panel2); box-shadow: inset 0 -4px 0 var(--accent); }
@media (max-width: 900px) {
  .nav button span { display: none; }
  .nav button[data-go="sound"] { font-size: 18px; }
  .xp small { display: none; }
}
@media (max-width: 560px) { .me-txt { display: none; } .top { gap: 8px; padding: 6px 10px; } .res { padding: 3px 5px; } }

/* ---------- Основная область ---------- */
.view { max-width: 1200px; margin: 0 auto; padding: 22px 18px 80px; }
.lead { color: var(--muted); margin-top: 4px; }
.sec-h { font-family: var(--f-pixel); font-size: 15px; margin: 34px 4px 14px; }
.sec-h small { font-family: var(--f-body); font-size: 14px; color: var(--muted); margin-left: 8px; }
.panel-pad { padding: 20px 24px; }
.note { color: var(--muted); font-size: 15px; }
.good { color: var(--good); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.center { justify-content: center; }

/* ---------- Карта ---------- */
.map-hero { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 26px; }
.hero-bot { animation: bob 2.4s steps(4) infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.bubble { position: relative; padding: 16px 20px; max-width: 60ch; }
.map-hero .bubble { flex: 1; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
.map-hero .bubble p { margin: 0; font-size: 19px; font-weight: 500; flex: 1 1 260px; }
.bubble::before { content: ""; position: absolute; left: -16px; bottom: 18px; width: 12px; height: 12px; background: var(--panel); box-shadow: -4px 0 0 var(--ink), 0 4px 0 var(--ink), 0 -4px 0 var(--ink); }

.world { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; position: relative; padding: 6px 0 14px; }
.world::before { content: ""; position: absolute; left: 6%; right: 6%; top: 64px; height: 8px; background: repeating-linear-gradient(90deg, var(--dirt) 0 16px, transparent 16px 24px); z-index: 0; }
.isle { position: relative; z-index: 1; border: 0; padding: 0 0 14px; text-align: left; display: flex; flex-direction: column; color: var(--text); transition: transform .12s; }
.isle:hover { transform: translateY(-4px); }
.isle.cur { box-shadow: 0 -4px 0 var(--gold), 0 4px 0 var(--gold), -4px 0 0 var(--gold), 4px 0 0 var(--gold), 0 0 0 8px var(--ink), 0 14px 0 rgba(0, 0, 0, .2); }
.isle-sky { height: 120px; display: grid; place-items: center; background: linear-gradient(var(--lc), var(--ld)); position: relative; overflow: hidden; }
.isle-sky::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: linear-gradient(90deg, var(--ground) 50%, var(--ground2) 50%) 0 0 / 16px 8px repeat-x, var(--dirt); }
.isle-sky svg { position: relative; z-index: 1; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .35)); margin-bottom: 14px; }
.isle.cleared .isle-sky::before { content: "★"; position: absolute; top: 6px; right: 10px; color: var(--gold); font-size: 22px; text-shadow: 0 2px 0 var(--ink); z-index: 2; }
.isle-name { font-family: var(--f-pixel); font-size: 12px; padding: 14px 14px 4px; }
.isle-blurb { font-size: 14px; color: var(--muted); padding: 0 14px; min-height: 2.8em; }
.isle-prog { margin: 10px 14px 0; height: 10px; background: var(--panel3); box-shadow: 0 0 0 2px var(--ink); }
.isle-prog i { display: block; height: 100%; background: var(--lc); }
.isle.locked { filter: grayscale(.85); opacity: .75; }
.isle-lock { position: absolute; top: 8px; left: 8px; z-index: 2; }
.loc-detail { margin-top: 28px; padding: 20px 22px; }
.loc-h { font-family: var(--f-pixel); font-size: 16px; display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
.lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lvl { border: 0; display: flex; align-items: center; gap: 14px; padding: 12px 14px; text-align: left; color: var(--text); background: var(--panel2); min-height: 72px; }
.lvl.open { background: var(--panel); animation: glow 1.6s steps(2) infinite; }
@keyframes glow { 50% { box-shadow: 0 -4px 0 var(--gold), 0 4px 0 var(--gold), -4px 0 0 var(--gold), 4px 0 0 var(--gold), 0 12px 0 rgba(0, 0, 0, .18); } }
.lvl.locked { opacity: .55; cursor: not-allowed; }
.lvl.done .lvl-n { background: var(--good); }
.lvl-n { font-family: var(--f-pixel); font-size: 14px; width: 42px; height: 42px; display: grid; place-items: center; background: var(--lc, var(--accent)); color: #fff; box-shadow: 0 0 0 3px var(--ink); flex: none; text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.loc-detail .lvl-n { background: var(--accent); }
.lvl-t { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.lvl-t b { font-size: 17px; }
.lvl-t small { color: var(--muted); font-family: var(--f-code); font-size: 13px; }
.lvl.boss .lvl-t small { font-family: var(--f-body); }
.lvl.boss { background: linear-gradient(90deg, rgba(224, 71, 58, .14), transparent 60%), var(--panel); }
.lvl-st .play { font-style: normal; display: grid; place-items: center; width: 34px; height: 34px; background: var(--gold); color: #1d1b26; box-shadow: 0 0 0 3px var(--ink); }
.stars i { font-style: normal; color: var(--panel3); font-size: 20px; text-shadow: 0 2px 0 var(--ink); }
.stars i.on { color: var(--gold); }
.stars.big i { font-size: 46px; }
@media (max-width: 980px) { .world { grid-template-columns: repeat(3, 1fr); } .world::before { display: none; } }
@media (max-width: 620px) { .world { grid-template-columns: repeat(2, 1fr); gap: 12px; } .isle-sky { height: 92px; } .map-hero { flex-direction: column; align-items: stretch; } .map-hero .bubble::before { display: none; } .hero-bot { align-self: flex-start; } }

/* ---------- Урок ---------- */
.crumbs { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.lesson-h { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; }
.lesson-h h1 { font-family: var(--f-pixel); font-size: clamp(18px, 3.4vw, 28px); margin: 0; letter-spacing: .5px; padding-bottom: 8px; box-shadow: 0 6px 0 var(--lc, var(--accent)); }
.sandbox .lesson-h, .base .lesson-h { display: block; }
.lesson-h .sub { font-size: 17px; }
.stages { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 20px; flex-wrap: wrap; counter-reset: st; }
.stages li { counter-increment: st; }
.stages button { border: 0; background: var(--panel2); padding: 8px 14px 8px 10px; font-weight: 600; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; min-height: 42px; color: var(--text); box-shadow: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink); margin: 2px; }
.stages button::before { content: counter(st); font-family: var(--f-pixel); font-size: 10px; width: 22px; height: 22px; display: grid; place-items: center; background: var(--panel3); }
.stages button.seen::before { background: var(--accent); color: #fff; }
.stages button.cur { background: var(--gold); color: #1d1b26; }
.stages button:disabled { opacity: .45; cursor: not-allowed; }
.stage-nav { display: flex; gap: 10px; margin-top: 26px; align-items: center; }
.rn-sp { flex: 1; }
.story { display: flex; flex-direction: column; gap: 18px; padding: 10px 0; }
.say-row { display: flex; align-items: flex-end; gap: 16px; animation: rise .45s both; }
.say-bot { width: 72px; flex: none; }
.story .bubble { font-size: 20px; padding: 18px 22px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.explain { max-width: 820px; font-size: 18px; }
.explain p { margin: 0 0 14px; max-width: 66ch; }
.explain .note { font-size: 16px; }
.types-table { display: grid; gap: 8px; margin-bottom: 16px; }
.types-table div { padding: 8px 12px; background: var(--panel2); border-left: 6px solid var(--accent); }
.types-table div:nth-child(2) { border-color: var(--blue); } .types-table div:nth-child(3) { border-color: var(--dirt); } .types-table div:nth-child(4) { border-color: var(--red); }
pre.py, .w-code { font-family: var(--f-code); font-size: 15px; line-height: 1.6; background: var(--code-bg); color: var(--code-text); padding: 14px 16px; overflow-x: auto; margin: 12px 0; box-shadow: 0 0 0 3px var(--ink); white-space: pre; }
.t-kw { color: var(--t-kw); font-weight: 600; } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); } .t-bi { color: var(--t-bi); }
.t-com { color: var(--t-com); font-style: italic; } .t-def { color: var(--t-def); } .t-fx { color: var(--t-fx); }

/* ---------- Задание ---------- */
.task-card { display: flex; gap: 16px; padding: 18px 20px; align-items: flex-start; }
.task-card h3 { margin: 0 0 6px; font-family: var(--f-pixel); font-size: 13px; }
.task-card p { margin: 0 0 6px; font-size: 18px; max-width: 75ch; }
.hints { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 16px 0 6px; }
.hints-l { font-weight: 600; margin-right: 6px; }
.hints .chip { font-family: var(--f-body); }
.hint-box { display: flex; gap: 12px; padding: 14px 16px; margin-top: 10px; background: #fff7d6; color: #1d1b26; }
:root[data-theme="dark"] .hint-box { background: #3a3420; color: var(--text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hint-box { background: #3a3420; color: var(--text); } }
.hint-box pre { margin: 10px 0; }
.task-run { margin-top: 18px; }
.verdict { margin-top: 18px; }
.verdict > div { display: flex; gap: 14px; align-items: center; padding: 14px 18px; }
.verdict p { margin: 2px 0 0; }
.v-good { background: var(--good-bg) !important; }
.v-bad { background: var(--bad-bg) !important; }

/* ---------- Запускатель ---------- */
.runner { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.rn-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 10px; }
.rn-right { display: flex; flex-direction: column; gap: 14px; }
.panel { padding: 0; overflow: hidden; }
.panel-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--panel2); font-weight: 700; font-size: 14px; }
.chest-note { font-weight: 500; color: var(--accent-d); font-size: 13px; }
.con .panel-h { background: var(--code-bg2); color: var(--code-text); }
.con-body { background: var(--code-bg); color: var(--code-text); font-family: var(--f-code); font-size: 15px; line-height: 1.55; padding: 12px 14px; min-height: 140px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.con-hint { color: var(--code-muted); font-family: var(--f-body); font-size: 14px; white-space: normal; }
.chest-body .con-hint, .canvas-panel .con-hint { color: var(--muted); padding: 4px; }
.con-in { color: var(--t-bi); }
.con-err { display: flex; gap: 10px; background: #3b1e25; color: #ffd9d4; padding: 10px; margin-top: 8px; font-family: var(--f-body); white-space: normal; box-shadow: inset 4px 0 0 var(--red); }
.con-err.soft { background: #2c3045; color: var(--code-text); box-shadow: inset 4px 0 0 var(--gold); }
.con-err p { margin: 2px 0 0; font-size: 15px; }
.con-input { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.con-input input { flex: 1; background: #0f1220; color: #fff; border: 0; padding: 8px 10px; font-family: var(--f-code); box-shadow: 0 0 0 2px var(--t-bi); min-width: 0; }
.chest-body { padding: 10px; max-height: 360px; overflow: auto; }
.chest-title { font-weight: 700; font-size: 13px; margin: 6px 2px; color: var(--muted); }
.chest-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.chest { background: var(--panel2); padding: 6px 8px 8px; min-width: 110px; max-width: 100%; box-shadow: 0 0 0 2px var(--ink); position: relative; }
.chest.new { animation: pop .35s; }
.chest.bump .chest-val { animation: bump .5s; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes bump { 40% { transform: translateY(-6px); background: var(--gold); } }
.chest-lid { display: flex; align-items: center; gap: 6px; font-family: var(--f-code); font-size: 14px; }
.chest-lid .tag { margin-left: auto; font-size: 11px; background: var(--ink); color: #fff; padding: 1px 5px; }
.chest-val { margin-top: 6px; position: relative; font-family: var(--f-code); font-size: 14px; }
.chest-val .old { position: absolute; right: 4px; top: 0; color: var(--bad); text-decoration: line-through; animation: toss .9s forwards; pointer-events: none; }
@keyframes toss { to { transform: translate(40px, -30px) rotate(25deg); opacity: 0; } }
.v { padding: 1px 6px; display: inline-block; }
.v-int { background: #d7f2cf; color: #1d4d14; } .v-float { background: #d2e6fb; color: #123d6e; }
.v-str { background: #f3e2c2; color: #5a3610; } .v-none { color: var(--muted); }
.v-fn { background: #f6d7e8; color: #6a1f45; }
.v-bool i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; background: var(--bad); box-shadow: 0 0 0 2px var(--ink); }
.v-bool.on i { background: #3fa34d; }
.v-list { display: flex; flex-wrap: wrap; gap: 4px; }
.slot { min-width: 44px; min-height: 44px; background: var(--panel); box-shadow: 0 0 0 2px var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 10px 3px 2px; font-size: 12px; }
.slot em { position: absolute; top: 0; left: 2px; font-style: normal; font-size: 10px; color: var(--muted); }
.slot small { font-size: 10px; max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-dict { display: flex; flex-direction: column; gap: 3px; }
.kv { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.kv b { color: var(--muted); }
.v-empty { color: var(--muted); font-size: 13px; }
.canvas-host { padding: 12px; display: grid; place-items: center; background: var(--panel2); }
.pc canvas { width: min(320px, 100%); height: auto; aspect-ratio: 1; image-rendering: pixelated; box-shadow: 0 0 0 3px var(--ink); display: block; background: #fff; }
.keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.key { border: 0; min-width: 38px; min-height: 38px; font-family: var(--f-code); font-size: 15px; background: var(--panel2); box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 var(--panel3); }
.key:active { transform: translateY(2px); }
@media (min-width: 1000px) and (hover: hover) { .keys { display: none; } }
@media (max-width: 860px) { .runner { grid-template-columns: 1fr; } }

/* редактор */
.ed { box-shadow: 0 0 0 3px var(--ink); background: var(--code-bg); }
.ed-scroll { display: flex; position: relative; overflow: auto; max-height: 460px; min-height: 240px; background: var(--code-bg); }
.ed-gutter { position: sticky; left: 0; z-index: 3; padding: 12px 8px 12px 10px; text-align: right; color: var(--code-muted); background: var(--code-bg2); font: 16px/24px var(--f-code); white-space: pre; user-select: none; min-width: 3em; height: max-content; min-height: 100%; }
.ed-area { position: relative; flex: 1 0 auto; min-width: 0; }
.ed-pre, .ed-ta { margin: 0; padding: 12px 16px; font: 16px/24px var(--f-code); white-space: pre; tab-size: 4; letter-spacing: 0; word-wrap: normal; overflow-wrap: normal; }
.ed-pre { position: relative; z-index: 1; pointer-events: none; color: var(--code-text); min-height: 216px; width: max-content; min-width: 100%; }
.ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: #ffffff; overflow: hidden; z-index: 2; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(95, 214, 232, .35); }
.ed-bar { position: absolute; left: 0; right: 0; height: 24px; z-index: 0; display: none; }
.ed-bar.step { background: rgba(247, 197, 49, .28); box-shadow: inset 4px 0 0 var(--gold); }
.ed-bar.err { background: rgba(224, 71, 58, .3); box-shadow: inset 4px 0 0 var(--red); }
.runner.busy .ed { box-shadow: 0 0 0 3px var(--gold); }

/* ---------- Викторина ---------- */
.quiz { max-width: 720px; }
.quiz h3 { font-size: 22px; margin: 6px 0 16px; }
.q-prog { font-family: var(--f-pixel); font-size: 10px; color: var(--muted); }
.q-opts { display: grid; gap: 10px; }
.q-opt { border: 0; text-align: left; padding: 14px 16px; font-size: 18px; background: var(--panel2); box-shadow: 0 0 0 3px var(--ink), inset 0 -4px 0 var(--panel3); min-height: 56px; color: var(--text); font-family: var(--f-code); }
.q-opt:hover:not(:disabled) { background: var(--gold); color: #1d1b26; }
.q-opt.right { background: var(--good-bg); box-shadow: 0 0 0 3px var(--good); }
.q-opt.wrong { background: var(--bad-bg); box-shadow: 0 0 0 3px var(--bad); }
.q-opt:disabled { cursor: default; }
.q-why p { margin: 16px 0 10px; }
.quiz-end { text-align: center; margin: 0 auto; }

/* ---------- Босс ---------- */
.boss-intro { display: flex; gap: 24px; align-items: center; margin: 10px 0 20px; flex-wrap: wrap; }
.boss-sprite { animation: menace 1.2s steps(2) infinite; transition: filter .6s, opacity .6s, transform .6s; }
.boss-sprite.beaten { animation: none; filter: grayscale(1); opacity: .5; transform: rotate(90deg) translateY(10px); }
@keyframes menace { 50% { transform: translateY(-4px) scaleX(1.04); } }
.boss-hp { width: 120px; height: 12px; margin-top: 10px; background: var(--panel3); box-shadow: 0 0 0 3px var(--ink); }
.boss-hp i { display: block; height: 100%; background: var(--red); transition: width 1s; }
.boss-bubble h1 { font-family: var(--f-pixel); font-size: clamp(16px, 3vw, 24px); margin: 0 0 8px; color: var(--lc); text-shadow: 2px 2px 0 var(--ink); }
.boss-bubble p { margin: 0; font-size: 18px; }

/* ---------- Окна и уведомления ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(10, 14, 28, .6); display: grid; place-items: center; padding: 20px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { max-width: 520px; width: 100%; padding: 24px; max-height: 88vh; overflow: auto; animation: rise .3s; }
.modal.wide { max-width: 980px; }
.modal h2 { font-family: var(--f-pixel); font-size: 16px; margin: 0 0 12px; line-height: 1.5; }
.modal-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 20px; }
.reward { text-align: center; }
.reward-chest { display: grid; place-items: center; animation: chestpop .6s; }
@keyframes chestpop { 0% { transform: scale(.4) rotate(-10deg); } 60% { transform: scale(1.15) rotate(4deg); } }
.loot { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0; }
.loot span { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel2); box-shadow: 0 0 0 2px var(--ink); animation: rise .4s both; }
.loot span:nth-child(2) { animation-delay: .1s; } .loot span:nth-child(3) { animation-delay: .2s; } .loot span:nth-child(4) { animation-delay: .3s; }
.loot b { font-size: 20px; }
.reward-note { color: var(--muted); }
.skin-get { display: flex; align-items: center; gap: 14px; justify-content: center; text-align: left; padding: 12px; background: var(--panel2); margin-top: 10px; color: var(--text); }
.welcome { text-align: center; }
.welcome-bot { display: grid; place-items: center; animation: bob 2s steps(4) infinite; }
.name-edit { display: flex; flex-direction: column; gap: 6px; font-weight: 600; text-align: left; margin-top: 10px; }
#toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 80px); right: 14px; z-index: 90; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: center; padding: 10px 14px; min-width: 240px; max-width: 340px; animation: slidein .35s; background: var(--panel); }
.toast small { display: block; color: var(--muted); font-size: 13px; }
.toast.hide { opacity: 0; transform: translateX(30px); transition: .5s; }
@keyframes slidein { from { transform: translateX(120%); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; }
.flyer { position: fixed; left: 0; top: 0; z-index: 96; pointer-events: none; }
.saved-img { width: 100%; max-width: 320px; image-rendering: pixelated; display: block; margin: 12px auto; box-shadow: 0 0 0 3px var(--ink); }

/* ---------- Шпаргалка ---------- */
.cheat { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.cheat-c { padding: 12px 14px; }
.cheat-c pre { font-size: 13px; padding: 10px; margin: 8px 0; }
.cheat-c small { color: var(--muted); }

/* ---------- База ---------- */
.base-scene { display: flex; align-items: flex-end; gap: 20px; padding: 26px 22px 0; background: linear-gradient(var(--bg2), var(--bg)); position: relative; overflow: hidden; }
.base-scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: linear-gradient(90deg, var(--ground) 50%, var(--ground2) 50%) 0 0 / 16px 8px repeat-x, var(--dirt); }
.base-hero { position: relative; z-index: 1; padding-bottom: 20px; }
.base-grid { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding-bottom: 26px; }
.bslot { aspect-ratio: 1; display: grid; place-items: center; background: rgba(255, 255, 255, .25); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .15); }
.crafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.craft { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px; text-align: center; }
.craft.no { opacity: .7; }
.cost { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; }
@media (max-width: 620px) { .base-grid { grid-template-columns: repeat(4, 1fr); } .base-hero { display: none; } }

/* ---------- Профиль ---------- */
.prof-top { display: flex; gap: 26px; align-items: center; padding: 22px; flex-wrap: wrap; }
.prof-hero { padding: 10px; background: var(--panel2); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.stats span { display: flex; flex-direction: column; padding: 8px 14px; background: var(--panel2); font-size: 13px; color: var(--muted); }
.stats b { font-family: var(--f-pixel); font-size: 15px; color: var(--text); margin-bottom: 4px; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.skin { border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; color: var(--text); text-align: center; }
.skin.cur { background: var(--gold); color: #1d1b26; }
.skin.locked { filter: grayscale(1); opacity: .6; cursor: not-allowed; }
.skin small { color: inherit; opacity: .8; font-size: 13px; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.ach:not(.got) { filter: grayscale(1); opacity: .55; }
.ach small { display: block; color: var(--muted); font-size: 14px; }
.danger { margin-top: 40px; text-align: right; }

/* ---------- Песочница ---------- */
.sandbox .w-row { margin-bottom: 12px; }

/* ---------- Заставка ---------- */
#intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #141a2e; color: #eef3ff; transition: opacity .5s; }
#intro.gone { opacity: 0; pointer-events: none; }
.intro-in { text-align: center; }
.intro-logo { font-family: var(--f-pixel); font-size: clamp(26px, 7vw, 54px); letter-spacing: 2px; text-shadow: 4px 4px 0 #2fa58a, 8px 8px 0 #05070f; }
.intro-blocks { display: flex; justify-content: center; gap: 4px; margin: 26px 0 18px; height: 40px; }
.intro-blocks span { width: 32px; height: 32px; animation: fall .5s cubic-bezier(.5, 0, .7, 1.4) both; }
@keyframes fall { from { transform: translateY(-140px); opacity: 0; } }
.intro-sub { font-size: 16px; color: #a9b4d0; }

/* ---------- Интерактивы ---------- */
.w-intro { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; color: var(--muted); }
.widget { display: flex; flex-direction: column; gap: 12px; }
.w-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.w-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; flex-wrap: wrap; }
.w-row input[type="range"] { flex: 1 1 200px; accent-color: var(--accent); min-height: 30px; }
.big-n { font-family: var(--f-pixel); font-size: 16px; min-width: 3ch; display: inline-block; }
.eq { font-family: var(--f-code); font-size: 24px; font-weight: 700; }
.w-msg { min-height: 1.5em; }
.w-tip { margin: 0; color: var(--muted); }
.w-code { margin: 0; }
.w-stage { display: flex; align-items: center; gap: 20px; padding: 10px; }
.w-bot.hop { animation: hop .4s; }
@keyframes hop { 40% { transform: translateY(-14px); } }
.bubble.big { font-size: 22px; min-height: 64px; min-width: 200px; font-weight: 600; }
.w-chests { display: flex; flex-wrap: wrap; gap: 18px; min-height: 120px; padding: 10px; background: var(--panel2); }
.w-chest { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; padding-top: 34px; }
.w-lbl { font-family: var(--f-code); font-weight: 700; background: var(--ink); color: #fff; padding: 1px 8px; }
.w-slot { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 30px; }
.w-tok { display: inline-block; font-family: var(--f-code); background: var(--gold); color: #1d1b26; padding: 2px 8px; box-shadow: 0 0 0 2px var(--ink); white-space: nowrap; }
.w-tok.in { animation: dropin .5s; }
.w-tok.out { position: absolute; left: 0; animation: tossout .65s forwards; background: var(--bad-bg); color: var(--bad); }
.w-tok.bad { background: var(--bad-bg); color: var(--bad); }
@keyframes dropin { from { transform: translateY(-40px); opacity: 0; } 70% { transform: translateY(6px); } }
@keyframes tossout { to { transform: translate(70px, -40px) rotate(40deg); opacity: 0; } }
.w-log { max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.w-log .w-code { padding: 6px 10px; }
.w-cards { display: flex; flex-wrap: wrap; gap: 8px; }
.card { border: 0; font-family: var(--f-code); font-size: 17px; padding: 10px 14px; background: var(--panel); box-shadow: 0 0 0 3px var(--ink), inset 0 -4px 0 var(--panel3); min-height: 48px; color: var(--text); }
.card.sel { background: var(--gold); color: #1d1b26; transform: translateY(-4px); }
.w-bins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.bin { border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; background: var(--panel2); box-shadow: 0 0 0 3px var(--ink); min-height: 140px; color: var(--text); }
.bin code { background: none; box-shadow: none; }
.bin-in { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
.bin-in span { font-family: var(--f-code); font-size: 12px; background: var(--panel); padding: 1px 5px; box-shadow: 0 0 0 1px var(--ink); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (max-width: 620px) { .w-bins { grid-template-columns: repeat(2, 1fr); } }
.w-stacks { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 10px; background: var(--panel2); }
.stk { position: relative; }
.stk i { position: absolute; right: -6px; bottom: -6px; font-style: normal; font-family: var(--f-pixel); font-size: 11px; background: var(--ink); padding: 2px 3px; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.stk.part { opacity: .75; } .stk.more { font-family: var(--f-pixel); font-size: 11px; align-self: center; }
.w-chat { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow: auto; padding: 10px; background: var(--panel2); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 90%; }
.msg > div { padding: 8px 12px; background: var(--panel); box-shadow: 0 0 0 2px var(--ink); }
.msg.me { align-self: flex-end; } .msg.me > div { background: var(--gold); color: #1d1b26; }
.msg.code > div { background: none; box-shadow: none; padding: 0; } .msg.code .w-code { padding: 6px 10px; font-size: 14px; }
.msg.err > div { background: var(--bad-bg); }
.msg.note > div { background: none; box-shadow: none; color: var(--muted); font-style: italic; }
.w-ops, .w-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.w-signwrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
.w-sign { min-width: 240px; max-width: 100%; padding: 18px 26px; text-align: center; font-family: var(--f-pixel); font-size: 14px; line-height: 1.6; color: #2a1607; background: repeating-linear-gradient(0deg, #c79a5b 0 10px, #b88a4c 10px 12px); box-shadow: 0 0 0 4px #5e3b22, 0 0 0 8px var(--ink); word-break: break-word; transform-origin: top center; }
.w-sign.swing { animation: swing .6s; }
@keyframes swing { 25% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } }
.w-post { width: 12px; height: 46px; background: #5e3b22; box-shadow: 0 0 0 3px var(--ink); }
.w-fork-wrap { background: var(--panel2); box-shadow: 0 0 0 3px var(--ink); }
.w-fork { width: 100%; height: auto; display: block; }
.w-fork .rail { fill: none; stroke: #8b6a4a; stroke-width: 10; stroke-dasharray: 4 6; }
.w-fork .dest rect { fill: var(--panel); stroke: var(--ink); stroke-width: 3; }
.w-fork .dest text { font: 700 10px var(--f-body); text-anchor: middle; fill: var(--text); }
.w-fork .dest.hit rect { fill: var(--gold); }
.w-lines .ln { display: block; margin: 0 -16px; padding: 0 16px; }
.w-lines .ln.on { background: rgba(247, 197, 49, .28); box-shadow: inset 4px 0 0 var(--gold); }
.w-lines em { font-style: normal; } .w-lines em.t { color: #7be3a0; } .w-lines em.f { color: #ff8a7f; }
.w-logic { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.levers { display: flex; flex-direction: column; gap: 8px; }
.lever-btn, .pin { border: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel2); box-shadow: 0 0 0 3px var(--ink); min-height: 50px; color: var(--text); font-family: var(--f-code); }
.lever-btn span { margin-left: auto; padding: 2px 8px; background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.lever-btn.on span { background: var(--good-bg); color: var(--good); }
.pin .inp { width: 6em; margin-left: auto; }
.door-wrap { flex: 1; display: grid; place-items: center; min-width: 180px; }
.door { width: 140px; height: 180px; position: relative; background: #1d1b26; box-shadow: 0 0 0 6px #6b7480, 0 0 0 10px var(--ink); overflow: hidden; }
.door .dl, .door .dr { position: absolute; top: 0; bottom: 0; width: 50%; background: repeating-linear-gradient(0deg, #8a5a35 0 16px, #6e4527 16px 20px); transition: transform .6s steps(6); }
.door .dl { left: 0; box-shadow: inset -3px 0 0 var(--ink); } .door .dr { right: 0; box-shadow: inset 3px 0 0 var(--ink); }
.door.open .dl { transform: translateX(-100%); } .door.open .dr { transform: translateX(100%); }
.door .lamp { position: absolute; top: 8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; background: var(--red); box-shadow: 0 0 0 3px var(--ink), 0 0 14px var(--red); z-index: 2; }
.door.open .lamp { background: #5bd46a; box-shadow: 0 0 0 3px var(--ink), 0 0 18px #5bd46a; }
.door::before { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--gold); font-size: 50px; }
.w-belt { position: relative; height: 110px; background: var(--panel2); box-shadow: 0 0 0 3px var(--ink); overflow: hidden; }
.belt-track { position: absolute; left: 0; right: 0; bottom: 18px; height: 60px; }
.w-belt::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 14px; background: repeating-linear-gradient(90deg, #3a3546 0 14px, #6b7480 14px 20px); box-shadow: 0 -3px 0 var(--ink); }
.w-belt.moving::after { animation: belt .5s linear infinite; }
@keyframes belt { to { background-position: 20px 0; } }
.belt-item { position: absolute; left: -50px; bottom: 6px; display: flex; flex-direction: column; align-items: center; transition: left 4.5s linear; }
.belt-item.go { left: calc(100% + 40px); }
.belt-item b { font-family: var(--f-pixel); font-size: 11px; }
.belt-counter { position: absolute; top: 8px; right: 12px; font-family: var(--f-code); font-size: 18px; background: var(--ink); color: #fff; padding: 2px 10px; }
.w-out { font-family: var(--f-code); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.chk { font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.chk input { width: 22px; height: 22px; accent-color: var(--red); }
.w-drill { display: flex; align-items: center; gap: 18px; padding: 14px; background: var(--panel2); box-shadow: 0 0 0 3px var(--ink); }
.w-drill.on .drill-bot { animation: drill .15s infinite; }
@keyframes drill { 50% { transform: translateY(4px) rotate(3deg); } }
.ore-bar { flex: 1; height: 28px; background: #3a3546; box-shadow: 0 0 0 3px var(--ink); }
.ore-bar i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, #f08a24 0 10px, #9aa3ad 10px 20px); transition: width .2s; }
.drill-n { font-weight: 700; white-space: nowrap; }

<script>
/* ===== interp.js ===== */
/* ==========================================================================
   МИНИ-ИНТЕРПРЕТАТОР PYTHON ДЛЯ БЛОКОДИИ
   Понимает подмножество Python, нужное для уроков: print, переменные, типы,

   while, break/continue, списки, словари, кортежи, def/return, import random/math/time.
   Каждая инструкция «отдаёт шаг» (yield) — так работает пошаговый режим,

(function (global) {

  }

  /* ---------- Значения Python ---------- */
  class PyFloat { constructor(v) { this.v = v; } }
  class PyList { constructor(items, view) { this.items = items || []; this.view = view || null; } }
  class PyTuple { constructor(items) { this.items = items || []; } }

  }
  class PyRange {
    constructor(a, b, c) { this.start = a; this.stop = b; this.step = c; }

      if (step > 0) return Math.max(0, Math.ceil((stop - start) / step));
      return Math.max(0, Math.ceil((start - stop) / -step));

  const isFloat = x => x instanceof PyFloat;

    throw new PyError('TypeError', `${typeName(k)} нельзя использовать как ключ словаря. Ключом может быть текст или число.`);
  }

  function typeName(x) {
    if (x === null || x === undefined) return 'None (пустота)';
    if (typeof x === 'boolean') return 'логическое значение (bool)';
    if (typeof x === 'number') return 'целое число (int)';
    if (x instanceof PyFloat) return 'дробное число (float)';
    if (typeof x === 'string') return 'текст (str)';
    if (x instanceof PyList) return 'список (list)';
    if (x instanceof PyTuple) return 'кортеж (tuple)';
    if (x instanceof PyDict) return 'словарь (dict)';
    if (x instanceof PyRange) return 'range';
    if (x instanceof PyFunc || x instanceof PyBuiltin) return 'функция';
    if (x instanceof PyModule) return 'модуль';
    return 'значение';
  }
  function pyTypeShort(x) {
    if (x === null || x === undefined) return 'NoneType';
    if (typeof x === 'boolean') return 'bool';
    if (typeof x === 'number') return 'int';
    if (x instanceof PyFloat) return 'float';
    if (typeof x === 'string') return 'str';
    if (x instanceof PyList) return 'list';
    if (x instanceof PyTuple) return 'tuple';
    if (x instanceof PyDict) return 'dict';
    if (x instanceof PyRange) return 'range';
    if (x instanceof PyFunc) return 'function';
    if (x instanceof PyBuiltin) return x.isType ? 'type' : 'builtin_function_or_method';
    if (x instanceof PyModule) return 'module';
    return 'object';
  }

  function fmtFloat(v) {
    if (Number.isNaN(v)) return 'nan';
    if (!Number.isFinite(v)) return v > 0 ? 'inf' : '-inf';
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return v.toFixed(1);
    if (Math.abs(v) >= 1e16) return v.toExponential().replace(/e([+-])(\d)$/, 'e$10$2');
    return String(v);
  }
  function pyRepr(x) {
    if (x === null || x === undefined) return 'None';
    if (typeof x === 'boolean') return x ? 'True' : 'False';
    if (typeof x === 'number') return String(x);
    if (x instanceof PyFloat) return fmtFloat(x.v);
    if (typeof x === 'string') {
      const q = x.includes("'") && !x.includes('"') ? '"' : "'";
      let s = x.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t');
      if (q === "'") s = s.replace(/'/g, "\\'");

    }
    if (x instanceof PyList) { const b = '[' + x.items.map(pyRepr).join(', ') + ']'; return x.view ? x.view + '(' + b + ')' : b; }
    if (x instanceof PyTuple) return x.items.length === 1 ? '(' + pyRepr(x.items[0]) + ',)' : '(' + x.items.map(pyRepr).join(', ') + ')';
    if (x instanceof PyDict) return '{' + x.entries().map(([k, v]) => pyRepr(k) + ': ' + pyRepr(v)).join(', ') + '}';
    if (x instanceof PyRange) return x.step === 1 ? `range(${x.start}, ${x.stop})` : `range(${x.start}, ${x.stop}, ${x.step})`;
    if (x instanceof PyFunc) return `<function ${x.name}>`;
    if (x instanceof PyBuiltin) return x.isType ? `<class '${x.name}'>` : `<built-in function ${x.name}>`;
    if (x instanceof PyModule) return `<module '${x.name}'>`;

  }
  const pyStr = x => (typeof x === 'string' ? x : pyRepr(x));

  function truthy(x) {
    if (x === null || x === undefined || x === false) return false;
    if (x === true) return true;
    if (typeof x === 'number') return x !== 0;
    if (x instanceof PyFloat) return x.v !== 0;
    if (typeof x === 'string') return x.length > 0;
    if (x instanceof PyList || x instanceof PyTuple) return x.items.length > 0;
    if (x instanceof PyDict) return x.size > 0;
    if (x instanceof PyRange) return x.length > 0;
    return true;
  }

  function pyEq(a, b) {
    if (isNum(a) && isNum(b)) return numVal(a) === numVal(b);
    if (typeof a === 'string' || typeof b === 'string') return a === b;
    if (a === null || b === null) return a === b;
    if ((a instanceof PyList && b instanceof PyList) || (a instanceof PyTuple && b instanceof PyTuple)) {
      return a.items.length === b.items.length && a.items.every((v, i) => pyEq(v, b.items[i]));
    }
    if (a instanceof PyDict && b instanceof PyDict) {
      if (a.size !== b.size) return false;
      return a.entries().every(([k, v]) => b.has(k) && pyEq(v, b.get(k)));

  function lev(a, b) {
    const m = a.length, n = b.length; if (Math.abs(m - n) > 3) return 99;
    const d = Array.from({ length: m + 1 }, (_, i) => [i]);
    for (let j = 1; j <= n; j++) d[0][j] = j;

  function suggest(name, candidates) {
    let best = null, bd = 99;
    for (const c of candidates) {
      if (c === name) continue;
      const d = c.toLowerCase() === name.toLowerCase() ? 0 : lev(name, c);
      if (d < bd) { bd = d; best = c; }

    return bd <= lim ? best : null;
  }

  /* ==========================================================================
     ТОКЕНАЙЗЕР: превращает текст программы в «слова» (токены)
     ========================================================================== */
  const KEYWORDS = new Set(['False', 'None', 'True', 'and', 'as', 'break', 'continue', 'def', 'elif', 'else', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'not', 'or', 'pass', 'return', 'while', 'lambda', 'class', 'try', 'except', 'with', 'yield', 'del', 'assert', 'raise', 'finally', 'nonlocal', 'async', 'await']);
  const OPS3 = ['**=', '//='];
  const OPS2 = ['==', '!=', '<=', '>=', '//', '**', '+=', '-=', '*=', '/=', '%=', '->'];

  function tokenize(src, baseLine) {

      if ('‘’'.includes(c)) throw S(`Здесь «книжный» апостроф ${c}. Python понимает только обычные кавычки: " или '.`);
      // операторы
      const three = src.substr(i, 3), two = src.substr(i, 2);
      if (OPS3.includes(three)) { push('OP', three); i += 3; continue; }
      if (OPS2.includes(two)) { push('OP', two); i += 2; continue; }
      if (OPS1.includes(c)) {
        if (OPEN.includes(c)) brackets.push({ ch: c, line });
        if (CLOSE.includes(c)) {
          const top = brackets.pop();
          if (!top) throw S(`Лишняя закрывающая скобка ${c}. Для неё нет открывающей.`);
          if (OPEN.indexOf(top.ch) !== CLOSE.indexOf(c)) throw S(`Скобки не совпадают: открыта ${top.ch}, а закрыта ${c}.`);
        }
        push('OP', c); i++; continue;
      }
      if (c === '!') throw S('Одинокий знак ! в Python не работает. «Не равно» пишется так: !=, а «не» — словом not.');
      throw S(`Python не знает символ «${c}». Проверь, не попал ли он сюда случайно.`);
    }
    if (brackets.length) {

      throw S(`Скобка ${b.ch} не закрыта. Добавь ${CLOSE[OPEN.indexOf(b.ch)]} в конце.`, b.line);
    }

    return toks;

    function readString(prefix) {

      let s = '';

        if (i >= n) throw S(`Текст не закрыт: не хватает закрывающей кавычки ${q}.`, startLine);

        if (!triple && ch === q) { i++; break; }

        if (ch === '\\' && !raw) {
          const e = src[i + 1];
          const map = { n: '\n', t: '\t', '\\': '\\', "'": "'", '"': '"', '0': '\0' };
          if (e in map) { s += map[e]; i += 2; continue; }
          if (e === '\n') { i += 2; line++; continue; }
          s += ch; i++; continue;
        }
        if (ch === '\n') line++;
        s += ch; i++;

      push(prefix.includes('f') ? 'FSTRING' : 'STRING', s, startLine);
    }

      while (!this.is('EOF')) {
        if (this.eat('NEWLINE')) continue;
        if (this.is('INDENT')) throw this.err('Лишний отступ в начале строки. Убери пробелы слева — эта строка не внутри if, for, while или def.');
        if (this.is('DEDENT')) { this.next(); continue; }
        body.push(this.statement());
      }
      return body;
    }

    statement() {
      const tok = this.peek();
      if (tok.type === 'NAME') {
        switch (tok.value) {
          case 'if': return this.ifStmt();
          case 'while': return this.whileStmt();
          case 'for': return this.forStmt();
          case 'def': return this.defStmt();
          case 'elif': case 'else':
            throw this.err(`«${tok.value}» стоит без своего if. Проверь отступы: ${tok.value} должен начинаться ровно под if, без лишних пробелов.`);
          case 'class': case 'try': case 'except': case 'with': case 'lambda': case 'yield': case 'raise': case 'assert': case 'del': case 'finally': case 'nonlocal': case 'async': case 'await':
            throw this.err(`Команду «${tok.value}» мир Блокодии пока не знает. Её проходят дальше, после этого курса!`);
        }
      }
      const s = this.simpleStmt();
      this.endStmt(s);
      return s;
    }

    endStmt(s) {
      if (this.eat('NEWLINE') || this.is('EOF')) return;
      if (this.eat('OP', ';')) { if (this.eat('NEWLINE') || this.is('EOF')) return; throw this.err('Пиши каждую команду на новой строке — так понятнее.'); }
      const k = this.peek();
      if (s && s.t === 'Expr' && s.e.t === 'Name' && s.e.name === 'print')
        throw this.err('После print нужны круглые скобки: print("Привет").', k);
      if (k.type === 'OP' && k.value === '=') throw this.err('Здесь лишний знак =. Слева от = должно быть только имя переменной.', k);
      if (k.type === 'STRING' || k.type === 'FSTRING') throw this.err('Два значения стоят рядом без знака. Если хочешь склеить текст — поставь + между ними, а в print() — запятую.', k);
      if (k.type === 'NUMBER' || k.type === 'NAME') throw this.err(`Не понимаю, что делает «${k.type === 'NUMBER' ? k.value.v : k.value}» в этой строке. Может, пропущен знак (+, -, *, =) или запятая?`, k);
      if (k.type === 'INDENT') throw this.err('Лишний отступ: строка начинается с пробелов, хотя она не внутри if, for или def.', k);
      throw this.err(`Лишний символ «${k.value}» в конце строки.`, k);
    }

    block(kw) {
      if (!this.isOp(':')) {
        const k = this.peek();
        if (k.type === 'OP' && k.value === '=' && (kw === 'if' || kw === 'elif' || kw === 'while'))
          throw this.err('В условии для сравнения нужно два знака равно: ==. Один знак = кладёт значение в переменную.', k);
        throw this.err(`Похоже, ты забыл двоеточие «:» в конце строки с ${kw} — Python без него не понимает, где начинается ${COMPOUND_HINT[kw] || 'блок'}.`, k);
      }
      this.next();
      if (this.eat('NEWLINE')) {
        if (!this.is('INDENT')) {
          throw this.err(`После строки с ${kw} и двоеточием следующие строки должны начинаться с отступа — 4 пробела (или клавиша Tab). Так Python понимает, что они внутри ${kw}.`);
        }
        this.next();
        const body = [];
        while (!this.is('DEDENT') && !this.is('EOF')) {
          if (this.eat('NEWLINE')) continue;
          if (this.is('INDENT')) throw this.err('Лишний отступ: у этой строки больше пробелов, чем у соседних в том же блоке.');
          body.push(this.statement());
        }
        this.eat('DEDENT');
        return body;
      }
      const s = this.simpleStmt(); this.endStmt(s); return [s];
    }

    ifStmt() {
      const line = this.next().line;
      const branches = []; let orelse = null;
      const c = this.test(); branches.push([c, this.block('if')]);
      while (this.isKw('elif')) { this.next(); const cc = this.test(); branches.push([cc, this.block('elif')]); }
      if (this.isKw('else')) { this.next(); orelse = this.block('else'); }
      return { t: 'If', branches, orelse, line };
    }
    whileStmt() {
      const line = this.next().line; const cond = this.test();
      return { t: 'While', cond, body: this.block('while'), line };
    }
    forTarget() {
      const names = [];
      do {
        const k = this.peek();
        if (k.type !== 'NAME' || KEYWORDS.has(k.value)) throw this.err('После for нужно имя переменной, например: for i in range(5):', k);
        names.push({ t: 'Name', name: this.next().value, line: k.line });
      } while (this.eat('OP', ','));
      return names.length === 1 ? names[0] : { t: 'Tuple', items: names };
    }
    forStmt() {
      const line = this.next().line;
      const target = this.forTarget();
      if (!this.isKw('in')) throw this.err('В цикле for нужно слово in. Например: for i in range(5):');
      this.next();
      const iter = this.testList();
      return { t: 'For', target, iter, body: this.block('for'), line };
    }
    defStmt() {
      const line = this.next().line;
      const k = this.peek();
      if (k.type !== 'NAME' || KEYWORDS.has(k.value)) throw this.err('После def нужно имя функции, например: def craft():', k);
      const name = this.next().value;
      if (!this.isOp('(')) throw this.err(`После имени функции нужны скобки: def ${name}():`);
      this.next();
      const params = [], defaults = [];
      while (!this.isOp(')')) {
        const pk = this.peek();
        if (pk.type !== 'NAME' || KEYWORDS.has(pk.value)) throw this.err('В скобках у def пишут имена параметров через запятую: def craft(wood, stone):', pk);
        params.push(this.next().value);
        if (this.eat('OP', '=')) defaults.push(this.test()); else if (defaults.length) throw this.err('Параметры со значением по умолчанию должны стоять в конце.');
        if (!this.eat('OP', ',')) break;
      }
      this.expectOp(')', 'Не хватает закрывающей скобки ) после параметров функции.');
      if (this.eat('OP', '->')) this.test();
      return { t: 'Def', name, params, defaults, body: this.block('def'), line };
    }

    simpleStmt() {
      const tok = this.peek(); const line = tok.line;
      if (tok.type === 'NAME') {
        switch (tok.value) {
          case 'pass': this.next(); return { t: 'Pass', line };
          case 'break': this.next(); return { t: 'Break', line };
          case 'continue': this.next(); return { t: 'Continue', line };
          case 'return': {
            this.next();
            const v = (this.is('NEWLINE') || this.is('EOF') || this.isOp(';')) ? null : this.testList();
            return { t: 'Return', v, line };
          }
          case 'global': {
            this.next(); const names = [];
            do { names.push(this.next().value); } while (this.eat('OP', ','));
            return { t: 'Global', names, line };
          }
          case 'import': {
            this.next(); const mods = [];
            do {
              const m = this.next(); if (m.type !== 'NAME') throw this.err('После import нужно имя модуля, например: import random', m);
              let alias = m.value; if (this.eat('NAME', 'as')) alias = this.next().value;
              mods.push([m.value, alias]);
            } while (this.eat('OP', ','));
            return { t: 'Import', mods, line };
          }
          case 'from': {
            this.next(); const m = this.next().value;
            if (!this.eat('NAME', 'import')) throw this.err(`Пиши так: from ${m} import randint`);
            const names = [];
            if (this.eat('OP', '*')) names.push('*');
            else do { const nm = this.next().value; let al = nm; if (this.eat('NAME', 'as')) al = this.next().value; names.push([nm, al]); } while (this.eat('OP', ','));
            return { t: 'FromImport', mod: m, names, line };
          }
        }
      }
      const e = this.testList();
      if (this.isOp('=')) {
        const parts = [e];
        while (this.eat('OP', '=')) parts.push(this.testList());
        const value = parts.pop();
        parts.forEach(tg => this.checkTarget(tg));
        return { t: 'Assign', targets: parts, value, line };
      }
      const k = this.peek();
      if (k.type === 'OP' && ['+=', '-=', '*=', '/=', '//=', '%=', '**='].includes(k.value)) {
        this.next(); this.checkTarget(e, true);
        return { t: 'AugAssign', target: e, op: k.value.slice(0, -1), value: this.test(), line };
      }
      return { t: 'Expr', e, line };
    }
    checkTarget(tg, single) {
      if (tg.t === 'Name' || tg.t === 'Sub') return;
      if (!single && (tg.t === 'Tuple' || tg.t === 'List')) { tg.items.forEach(x => this.checkTarget(x, true)); return; }
      if (tg.t === 'Call') throw new PyError('SyntaxError', 'Слева от = должно стоять имя переменной, а не вызов функции. Пиши наоборот: x = input()', tg.line);
      if (tg.t === 'Num' || tg.t === 'Str' || tg.t === 'Const' || tg.t === 'FStr')
        throw new PyError('SyntaxError', 'Слева от = должно быть имя сундука (переменной), а справа — значение. Пиши так: coins = 5', tg.line);
      if (tg.t === 'Compare') throw new PyError('SyntaxError', 'Слева от = стоит сравнение. Для сравнения используй ==, а = — чтобы положить значение в переменную.', tg.line);
      throw new PyError('SyntaxError', 'Слева от = должно быть имя переменной.', tg.line);
    }

    atTerminator() {
      const k = this.peek();
      return k.type === 'NEWLINE' || k.type === 'EOF' || (k.type === 'OP' && ['=', ')', ']', '}', ':'].includes(k.value));
    }
    testList() {
      const first = this.test();
      if (!this.isOp(',')) return first;
      const items = [first];
      while (this.eat('OP', ',')) { if (this.atTerminator()) break; items.push(this.test()); }
      return { t: 'Tuple', items, line: first.line };
    }
    test() {
      const e = this.orTest();
      if (this.isKw('if') ) {
        // тернарный оператор: a if условие else b
        const save = this.p; this.next();
        const c = this.orTest();
        if (!this.isKw('else')) { this.p = save; return e; }
        this.next(); const b = this.test();
        return { t: 'IfExp', c, a: e, b, line: e.line };
      }
      return e;
    }
    orTest() {
      let l = this.andTest();
      while (this.isKw('or')) { this.next(); l = { t: 'Bool', op: 'or', l, r: this.andTest(), line: l.line }; }
      return l;
    }
    andTest() {
      let l = this.notTest();
      while (this.isKw('and')) { this.next(); l = { t: 'Bool', op: 'and', l, r: this.notTest(), line: l.line }; }
      return l;
    }
    notTest() {
      if (this.isKw('not')) { const line = this.next().line; return { t: 'Not', e: this.notTest(), line }; }
      return this.comparison();
    }
    comparison() {
      const first = this.arith(); const ops = [], items = [first];
      while (true) {
        const k = this.peek();
        if (k.type === 'OP' && ['<', '>', '==', '>=', '<=', '!='].includes(k.value)) { this.next(); ops.push(k.value); }
        else if (this.isKw('in')) { this.next(); ops.push('in'); }
        else if (this.isKw('not') && this.peek(1).type === 'NAME' && this.peek(1).value === 'in') { this.next(); this.next(); ops.push('not in'); }
        else if (this.isKw('is')) { this.next(); ops.push(this.eat('NAME', 'not') ? 'is not' : 'is'); }
        else break;
        if (this.isOp('=')) throw this.err('Знак сравнения записан неправильно. Правильно так: >=, <=, ==.');
        items.push(this.arith());
      }
      return ops.length ? { t: 'Compare', ops, items, line: first.line } : first;
    }
    arith() {
      let l = this.term();
      while (this.isOp('+') || this.isOp('-')) { const op = this.next().value; l = { t: 'Bin', op, l, r: this.term(), line: l.line }; }
      return l;
    }
    term() {
      let l = this.factor();
      while (this.isOp('*') || this.isOp('/') || this.isOp('//') || this.isOp('%')) { const op = this.next().value; l = { t: 'Bin', op, l, r: this.factor(), line: l.line }; }
      return l;
    }
    factor() {
      if (this.isOp('-') || this.isOp('+')) { const tk = this.next(); return { t: 'Unary', op: tk.value, e: this.factor(), line: tk.line }; }
      return this.power();
    }
    power() {
      const b = this.atomExpr();
      if (this.isOp('**')) { this.next(); return { t: 'Bin', op: '**', l: b, r: this.factor(), line: b.line }; }
      return b;
    }
    atomExpr() {
      let e = this.atom();
      while (true) {
        if (this.isOp('(')) {
          const line = this.next().line; const args = [], kwargs = [];
          while (!this.isOp(')')) {
            if (this.peek().type === 'NAME' && this.peek(1).type === 'OP' && this.peek(1).value === '=') {
              const nm = this.next().value; this.next(); kwargs.push([nm, this.test()]);
            } else {
              if (kwargs.length) throw this.err('Сначала пиши обычные значения, а значения с именем (sep=, end=) — в конце.');
              args.push(this.test());
            }
            if (this.isOp(')')) break;
            if (!this.isOp(',')) {
              const k = this.peek();
              if (k.type === 'NEWLINE' || k.type === 'EOF') throw this.err('Не хватает закрывающей скобки ).');
              throw this.err('Между значениями в скобках нужна запятая.', k);
            }
            this.next();
          }
          this.next();
          e = { t: 'Call', fn: e, args, kwargs, line: e.line || line };
        } else if (this.isOp('[')) {
          const line = this.next().line;
          let idx;
          if (this.isOp(':') || true) {
            let lo = null, hi = null, st = null, isSlice = false;
            if (!this.isOp(':')) lo = this.test();
            if (this.eat('OP', ':')) {
              isSlice = true;
              if (!this.isOp(']') && !this.isOp(':')) hi = this.test();
              if (this.eat('OP', ':')) { if (!this.isOp(']')) st = this.test(); }
            }
            idx = isSlice ? { t: 'Slice', lo, hi, st } : lo;
          }
          if (!idx) throw this.err('В квадратных скобках нужен номер, например inventory[0].');
          this.expectOp(']', 'Не хватает закрывающей квадратной скобки ].');
          e = { t: 'Sub', obj: e, idx, line: e.line || line };
        } else if (this.isOp('.')) {
          this.next(); const k = this.next();
          if (k.type !== 'NAME') throw this.err('После точки нужно имя команды, например .append', k);
          e = { t: 'Attr', obj: e, name: k.value, line: e.line || k.line };
        } else break;
      }
      return e;
    }
    atom() {
      const k = this.peek(); const line = k.line;
      if (k.type === 'NUMBER') { this.next(); return { t: 'Num', v: k.value.v, f: k.value.f, line }; }
      if (k.type === 'STRING' || k.type === 'FSTRING') {
        const parts = []; let hasF = false;
        while (this.is('STRING') || this.is('FSTRING')) {
          const s = this.next();
          if (s.type === 'STRING') parts.push(s.value); else { hasF = true; parts.push(...parseFString(s.value, s.line)); }
        }
        if (!hasF) return { t: 'Str', v: parts.join(''), line };
        return { t: 'FStr', parts, line };
      }
      if (k.type === 'NAME') {
        this.next();
        if (k.value === 'True') return { t: 'Const', v: true, line };
        if (k.value === 'False') return { t: 'Const', v: false, line };
        if (k.value === 'None') return { t: 'Const', v: null, line };
        if (KEYWORDS.has(k.value)) {
          if (k.value === 'true' || k.value === 'false') return null;
          throw this.err(`«${k.value}» — служебное слово Python. Здесь его использовать нельзя.`, k);
        }
        if (k.value === 'true' || k.value === 'false') return { t: 'Name', name: k.value, line };
        return { t: 'Name', name: k.value, line };
      }
      if (k.type === 'OP') {
        if (k.value === '(') {
          this.next();
          if (this.eat('OP', ')')) return { t: 'Tuple', items: [], line };
          const first = this.test();
          if (this.isOp(',')) {
            const items = [first];
            while (this.eat('OP', ',')) { if (this.isOp(')')) break; items.push(this.test()); }
            this.expectOp(')', 'Не хватает закрывающей скобки ).');
            return { t: 'Tuple', items, line };
          }
          this.expectOp(')', 'Не хватает закрывающей скобки ).');
          return first;
        }
        if (k.value === '[') {
          this.next(); const items = [];
          if (this.eat('OP', ']')) return { t: 'List', items, line };
          const first = this.test();
          if (this.isKw('for')) {
            this.next(); const target = this.forTarget();
            if (!this.eat('NAME', 'in')) throw this.err('В списке с for нужно слово in.');
            const iter = this.orTest(); let cond = null;
            if (this.eat('NAME', 'if')) cond = this.orTest();
            this.expectOp(']', 'Не хватает закрывающей скобки ].');
            return { t: 'ListComp', elt: first, target, iter, cond, line };
          }
          items.push(first);
          while (this.eat('OP', ',')) { if (this.isOp(']')) break; items.push(this.test()); }
          this.expectOp(']', 'В списке значения разделяют запятыми, а в конце ставят ].');
          return { t: 'List', items, line };
        }
        if (k.value === '{') {
          this.next(); const pairs = [];
          while (!this.isOp('}')) {
            const key = this.test();
            if (!this.isOp(':')) throw this.err('В словаре после ключа нужно двоеточие: {"факел": "уголь + палка"}');
            this.next(); pairs.push([key, this.test()]);
            if (!this.eat('OP', ',')) break;
          }
          this.expectOp('}', 'В словаре пары разделяют запятыми, а в конце ставят }.');
          return { t: 'Dict', pairs, line };
        }
      }
      if (k.type === 'NEWLINE' || k.type === 'EOF') throw this.err('Строка закончилась раньше времени — здесь не хватает значения.', k);
      if (k.type === 'INDENT' || k.type === 'DEDENT') throw this.err('Не хватает значения.', k);
      if (k.type === 'OP' && k.value === '=') throw this.err('Здесь лишний знак =. Для сравнения пиши ==.', k);
      throw this.err(`Не ожидал здесь «${k.value}». Возможно, пропущено значение или скобка.`, k);
    }
  }

  // Разбор f-строки на кусочки: текст и выражения в {}
  function parseFString(s, line) {
    const parts = []; let lit = ''; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === '{') {
        if (s[i + 1] === '{') { lit += '{'; i += 2; continue; }
        let depth = 0, j = i + 1, q = null, colon = -1;
        for (; j < s.length; j++) {
          const ch = s[j];
          if (q) { if (ch === q) q = null; continue; }
          if (ch === '"' || ch === "'") { q = ch; continue; }
          if ('([{'.includes(ch)) depth++;
          else if (')]'.includes(ch)) depth--;
          else if (ch === '}') { if (depth === 0) break; depth--; }
          else if (ch === ':' && depth === 0 && colon < 0) colon = j;
          else if (ch === '!' && depth === 0 && s[j + 1] !== '=' && colon < 0) colon = j;
        }
        if (j >= s.length) throw new PyError('SyntaxError', 'В f-строке не закрыта фигурная скобка }.', line);
        const exprSrc = s.slice(i + 1, colon >= 0 ? colon : j);
        let spec = colon >= 0 ? s.slice(colon + 1, j) : '';
        if (spec.startsWith('r:') || spec === 'r' || spec === 's') spec = spec.replace(/^[rs]:?/, '');
        if (!exprSrc.trim()) throw new PyError('SyntaxError', 'В f-строке пустые фигурные скобки {}. Внутрь нужно положить имя переменной: {name}', line);
        const p = new Parser(tokenize(exprSrc.trim(), line));
        const e = p.testList();
        if (lit) { parts.push(lit); lit = ''; }
        parts.push({ e, spec });
        i = j + 1; continue;
      }
      if (c === '}') {
        if (s[i + 1] === '}') { lit += '}'; i += 2; continue; }
        throw new PyError('SyntaxError', 'В f-строке лишняя скобка }.', line);
      }
      lit += c; i++;
    }
    if (lit) parts.push(lit);
    return parts;
  }

  function formatSpec(v, spec, line) {
    if (!spec) return pyStr(v);
    const m = /^(?:(.)?([<>^]))?(0)?(\d+)?(,)?(?:\.(\d+))?([sdf%])?$/.exec(spec);
    if (!m) return pyStr(v);
    const [, fillCh, align, zero, width, comma, prec, type] = m;
    let s;
    if (type === 'f' || (prec !== undefined && isNum(v))) s = numVal(v).toFixed(prec !== undefined ? +prec : 6);
    else if (type === '%') s = (numVal(v) * 100).toFixed(prec !== undefined ? +prec : 6) + '%';
    else if (type === 'd') { if (!isInt(v)) throw new PyError('ValueError', 'Формат :d подходит только для целых чисел.', line); s = String(numVal(v)); }
    else s = pyStr(v);
    if (comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    if (width) {
      const w = +width; const fc = fillCh || (zero ? '0' : ' ');
      const al = align || (isNum(v) ? '>' : '<');
      if (s.length < w) {
        const pad = w - s.length;
        if (al === '<') s = s + fc.repeat(pad);
        else if (al === '>') s = fc.repeat(pad) + s;
        else s = fc.repeat(Math.floor(pad / 2)) + s + fc.repeat(Math.ceil(pad / 2));
      }
    }
    return s;
  }

  function parse(src) {
    const toks = tokenize(src);
    return new Parser(toks).program();
  }

  /* ==========================================================================
     ВЫПОЛНЕНИЕ

/* ===== runtime.js ===== */
/* ==========================================================================

   ========================================================================== */
const GRID = 16;
const COLOR_NAMES = {
  red: '#e0473a', orange: '#f08a24', yellow: '#f7c531', green: '#3fa34d', lime: '#9be05a', cyan: '#4fd0e3',
  blue: '#3d6fe0', purple: '#9b5de5', pink: '#ff8fc0', brown: '#8a5a35', gray: '#8b93a1', grey: '#8b93a1',
  black: '#1d1b26', white: '#ffffff', gold: '#f2b705', navy: '#1f3a8a', magenta: '#e04fb8', teal: '#2a9d8f',
  'красный': '#e0473a', 'оранжевый': '#f08a24', 'жёлтый': '#f7c531', 'желтый': '#f7c531', 'зелёный': '#3fa34d', 'зеленый': '#3fa34d',
  'салатовый': '#9be05a', 'голубой': '#4fd0e3', 'синий': '#3d6fe0', 'фиолетовый': '#9b5de5', 'розовый': '#ff8fc0',
  'коричневый': '#8a5a35', 'серый': '#8b93a1', 'чёрный': '#1d1b26', 'черный': '#1d1b26', 'белый': '#ffffff', 'золотой': '#f2b705',
};
function resolveColor(c, line) {
  const s = MiniPy.pyStr(c).trim().toLowerCase();
  if (COLOR_NAMES[s]) return COLOR_NAMES[s];
  if (/^#[0-9a-f]{6}$/.test(s) || /^#[0-9a-f]{3}$/.test(s)) return s;
  throw new MiniPy.PyError('ValueError', `Цвет «${MiniPy.pyStr(c)}» мне не знаком. Попробуй: "red", "green", "blue", "yellow", "purple", "black" — или "#ff8800".`, line);
}
function emptyGrid() { return Array.from({ length: GRID }, () => Array(GRID).fill(null)); }

// Встроенные команды холста. onChange(grid) вызывается при каждом рисовании
function drawBuiltins(grid, onChange) {
  const B = MiniPy.PyBuiltin;
  const toCell = (v, name, line) => {
    if (!MiniPy.isNum(v) || typeof v === 'boolean') throw new MiniPy.PyError('TypeError', `${name} должен быть целым числом от 0 до 15.`, line);
    const n = MiniPy.numVal(v);
    if (!Number.isInteger(n)) throw new MiniPy.PyError('TypeError', `${name} = ${n} — дробное. Клетки бывают только целые: от 0 до 15.`, line);
    return n;
  };
  return {
    draw: new B('draw', (a, kw, line) => {
      if (a.length !== 3) throw new MiniPy.PyError('TypeError', `draw() ждёт три значения: draw(x, y, "цвет"), а получила ${a.length}.`, line);
      const x = toCell(a[0], 'x', line), y = toCell(a[1], 'y', line);
      if (x < 0 || x >= GRID || y < 0 || y >= GRID) throw new MiniPy.PyError('IndexError', `Клетка (${x}, ${y}) за краем холста. x и y должны быть от 0 до 15.`, line);
      grid[y][x] = resolveColor(a[2], line); onChange && onChange(grid, x, y); return null;
    }),
    fill: new B('fill', (a, kw, line) => {
      const c = resolveColor(a[0], line);
      for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) grid[y][x] = c;
      onChange && onChange(grid); return null;
    }),
    clear: new B('clear', () => { for (const row of grid) row.fill(null); onChange && onChange(grid); return null; }),
  };
}

// Обёртка результата запуска для функций check()
function makeResult(code, interp, error, grid) {
  const vars = interp.globals.vars;
  const out = interp.output;
  return {
    code, out, error, interp, grid: grid || emptyGrid(), inputs: interp.inputs,
    lines: out.split('\n').map(s => s.replace(/\s+$/, '')).filter(s => s.trim() !== ''),
    has: n => vars.has(n),
    raw: n => vars.get(n),
    get: n => (vars.has(n) ? MiniPy.toJS(vars.get(n)) : undefined),
    type: n => (vars.has(n) ? MiniPy.pyTypeShort(vars.get(n)) : null),
    repr: n => (vars.has(n) ? MiniPy.pyRepr(vars.get(n)) : '—'),
  };
}

// Инструменты для проверки
const CheckCtx = {
  // Заменяет первую строку вида «имя = …» (без отступа) на новое значение
  withVars(code, vars) {
    let lines = code.split('\n');
    for (const k in vars) {
      const re = new RegExp('^' + k + '\\s*=(?!=)');
      const i = lines.findIndex(l => re.test(l));
      if (i < 0) return null;
      lines[i] = `${k} = ${vars[k]}`;
    }
    return lines.join('\n');
  },
  rerun(code, opts) {
    const grid = emptyGrid();
    const res = MiniPy.runSync(code, { inputs: (opts && opts.inputs) || [], extraBuiltins: drawBuiltins(grid), maxSteps: 60000 });
    return makeResult(code, res.interp, res.error, grid);
  },
  val(r, name) { return r.get(name); },
  call(r, name, args) {
    const f = r.raw(name);
    const v = MiniPy.callSync(r.interp, f, args.map(a => (typeof a === 'number' && !Number.isInteger(a) ? new MiniPy.PyFloat(a) : a)));
    return MiniPy.toJS(v);
  },
};

<script>
/* ===== content.js ===== */
/* ==========================================================================

   Чтобы добавить новый уровень: добавь объект в TOPICS (и его id в нужную
   локацию в LOCATIONS). Поля:
     story   — реплики Болтика (массив строк, {игрок} заменится на имя)
     explain — HTML-объяснение; код в <pre class="py">…</pre> подсветится сам
     widget  — id интерактива из widgets.js (можно не указывать)
     task    — { text, starter, hints:[{text, code}], check(r, ctx) }
     quiz    — [{ q, a:[варианты], ok: номер верного, why }]
     cheat   — { code, note } для шпаргалки
   check(r, ctx) возвращает { ok:true } или { ok:false, msg:'что не так' }.
     r.out — весь вывод, r.lines — непустые строки вывода, r.get('имя') — значение
     переменной, r.type('имя') — её тип ('int', 'str'…), r.inputs — ответы на input(),
     r.grid — холст 16×16, r.code — код ученика.
     ctx.withVars(code, {имя:'значение'}) — подменяет строку «имя = …» в коде,

const OK = { ok: true };
const fail = msg => ({ ok: false, msg });
const countMatches = (s, re) => (s.match(re) || []).length;
const low = s => String(s).toLowerCase();

// Прогоняет код с разными значениями переменных и сравнивает вывод
function variantCheck(r, ctx, variants, describe) {
  for (const v of variants) {
    const code = ctx.withVars(r.code, v.vars);
    if (!code) return fail(`Оставь в начале программы строки ${Object.keys(v.vars).map(k => `«${k} = …»`).join(', ')} — проверка подставляет туда разные значения.`);
    const rr = ctx.rerun(code, { inputs: v.inputs });
    if (rr.error) return fail(`Когда ${describe(v.vars)}, программа падает с ошибкой: ${rr.error.message}`);
    const out = low(rr.out);
    if (!v.expect.test(out)) return fail(`Когда ${describe(v.vars)}, ожидалось «${v.label}», а программа вывела: «${rr.out.trim() || 'ничего'}».`);
    if (v.not && v.not.some(re => re.test(out))) return fail(`Когда ${describe(v.vars)}, программа вывела лишнее: «${rr.out.trim()}». Должна сработать только одна ветка.`);
  }
  return OK;
}

/* ---------- Эффекты: пиксельный салют и выпадение ресурсов ---------- */

/* ---------- Отображение значений в сундуках ---------- */
function valueHTML(v, depth) {
  const P = MiniPy; depth = depth || 0;
  const t = P.pyTypeShort(v);
  if (t === 'int') return `<span class="v v-int" title="int — целое число">${esc(P.pyRepr(v))}</span>`;
  if (t === 'float') return `<span class="v v-float" title="float — дробное число">${esc(P.pyRepr(v))}</span>`;
  if (t === 'str') return `<span class="v v-str" title="str — текст">${esc(P.pyRepr(v))}</span>`;
  if (t === 'bool') return `<span class="v v-bool ${v ? 'on' : 'off'}" title="bool — рычаг"><i></i>${v ? 'True' : 'False'}</span>`;
  if (t === 'NoneType') return `<span class="v v-none">None</span>`;
  if (t === 'list' || t === 'tuple') {
    if (depth > 1) return `<span class="v">${esc(P.pyRepr(v))}</span>`;
    const items = v.items.slice(0, 18).map((x, i) => {
      const sp = typeof x === 'string' ? itemSprite(x, 22) : null;
      return `<span class="slot" title="[${i}] ${esc(P.pyRepr(x))}"><em>${i}</em>${sp ? sp + `<small>${esc(x)}</small>` : valueHTML(x, depth + 1)}</span>`;

  }

  if (t === 'range') return `<span class="v">${esc(P.pyRepr(v))}</span>`;

}

      c.fillRect(x * s, y * s, s, s);
